<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nordic Ski Centers</title>
<meta name="viewport" content="initial-scale=1,width=device-width" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.css" rel="stylesheet" />
<script data-goatcounter="https://nordic-centers.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>

/* =========================================================
   Design tokens
   ========================================================= */
:root {
  --navy:        #12355b;
  --ink:         #12212f;
  --muted:       #4d5d6c;
  --link:        #1d5f9e;
  --ice:         #e8f3fa;
  --line:        #e3e8ed;
  --chip:        #f1f4f7;
  --warm-bg:     #fdf0e3;
  --warm-fg:     #7a3d06;
  --water:       #cfe6f3;

  --radius-pill:  20px;
  --radius-panel: 12px;
  --radius-input: 8px;

  --shadow-popover: 0 10px 30px rgba(18,33,47,.16);
  --shadow-control: 0 2px 8px rgba(18,33,47,.18);
}

/* =========================================================
   Reset & base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================================================
   Header
   ========================================================= */
.site-header {
  height: 68px;
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 10;
}

.site-header__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  text-decoration: none;
  color: inherit;
}

.site-header__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.2;
}

.site-header__tagline {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.2;
}

.site-header__search {
  flex: 1;
  max-width: 620px;
  margin: 0 auto;
  position: relative;
}

.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  display: flex;
}

.search-input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 36px 0 38px;
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  appearance: none;
}

.search-input:focus {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
  border-color: var(--navy);
}

.search-input::placeholder { color: var(--muted); }
.search-input-wrap--has-value .search-input { padding-right: 72px; }
.search-input { padding-right: 40px; } /* room for geolocate button */

.search-clear-btn,
.search-geo-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  padding: 0;
  border-radius: 4px;
}
.search-clear-btn:hover,
.search-geo-btn:hover { color: var(--ink); }
.search-clear-btn:focus-visible,
.search-geo-btn:focus-visible { outline: 2px solid #6cc0e5; outline-offset: 1px; }
.search-geo-btn { right: 8px; width: 28px; height: 28px; }
.search-clear-btn { right: 38px; width: 24px; height: 24px; }
.search-geo-btn.is-loading svg { animation: geo-spin 0.8s linear infinite; }
@keyframes geo-spin { to { transform: rotate(360deg); } }

.search-listbox {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-popover);
  z-index: 200;
  max-height: 280px;
  overflow-y: auto;
}
.search-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  color: var(--ink);
}
.search-option:hover,
.search-option.is-active { background: var(--ice); }
.search-option__icon { flex-shrink: 0; font-size: 13px; line-height: 1; }
.search-option__label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.user-location-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #2f80ed;
  border: 2px solid #fff;
  box-shadow: 0 0 0 4px rgba(47,128,237,0.25), 0 2px 6px rgba(0,0,0,0.2);
}

.site-header__actions { flex-shrink: 0; }

.btn-share {
  height: 36px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-share:hover { background: var(--chip); }

/* =========================================================
   Filter bar
   ========================================================= */
.filter-bar {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chip {
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}

.chip:hover { background: var(--chip); }

.chip[aria-pressed="true"],
.chip.is-active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

/* =========================================================
   Main body
   ========================================================= */
.main-body {
  display: flex;
  flex-wrap: nowrap;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* =========================================================
   Sidebar
   ========================================================= */
.sidebar {
  flex: 1 1 380px;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: #fff;
  overflow: hidden;
  min-height: 0;
}

/* Trail length area (wired in Step 4) */
.trail-length-area {
  flex-shrink: 0;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}

.trail-length-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.trail-length-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.trail-length-readout {
  font-size: 14px;
  color: var(--muted);
}

.trail-length-track {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  margin-bottom: 6px;
}

.trail-length-axis {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* Results header */
.results-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  gap: 8px;
  min-height: 44px;
}

.results-count {
  font-size: 14px;
  color: var(--muted);
  flex: 1;
  min-width: 0;
}

.sort-select {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 8px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
  flex-shrink: 0;
}

.sort-select:focus {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
}

/* Feature listing */
.listing {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.listing.scrolled {
  box-shadow: inset 0 6px 6px -6px rgba(0,0,0,.1);
}

/* =========================================================
   Detail panel
   ========================================================= */
.detail-panel {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding: 0 16px 32px;
}
.detail-panel__back {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  padding: 14px 0 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--link);
  cursor: pointer;
  margin: 0 -4px;
  border-radius: 4px;
}
.detail-panel__back:hover { color: var(--navy); }
.detail-panel__back:focus-visible { outline: 3px solid #6cc0e5; outline-offset: 1px; }
.detail-panel__header { margin-bottom: 14px; }
.detail-panel__name {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  margin: 0 0 4px;
  line-height: 1.2;
}
.detail-panel__region {
  font-size: 14px;
  color: var(--muted);
}
.detail-panel__actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.btn-directions,
.btn-website {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 18px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.btn-directions {
  background: var(--navy);
  color: #fff;
  border: none;
}
.btn-directions:hover { background: #0e284a; }
.btn-website {
  background: #fff;
  color: var(--navy);
  border: 1px solid var(--line);
}
.btn-website:hover { border-color: var(--navy); background: var(--ice); }
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
  margin-bottom: 20px;
}
.detail-grid__item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.detail-grid__label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.detail-grid__value {
  font-size: 15px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-grid__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
}
.detail-notes {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

/* =========================================================
   Welcome banner
   ========================================================= */
.welcome-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  background: var(--ice);
  border-bottom: 1px solid var(--water);
  font-size: 13px;
  color: var(--ink);
  flex-shrink: 0;
}
.welcome-banner__text { flex: 1; line-height: 1.4; }
.welcome-banner__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.welcome-start-fresh {
  background: none;
  border: 1.5px solid var(--navy);
  border-radius: var(--radius-pill);
  padding: 3px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
  white-space: nowrap;
}
.welcome-start-fresh:hover { background: var(--water); }
.welcome-start-fresh:focus-visible { outline: 3px solid #6cc0e5; outline-offset: 1px; }
.welcome-dismiss {
  background: none;
  border: none;
  font-size: 18px;
  line-height: 1;
  color: var(--muted);
  cursor: pointer;
  padding: 0 2px;
}
.welcome-dismiss:hover { color: var(--ink); }

/* =========================================================
   Share popover
   ========================================================= */
.share-wrap { position: relative; }
.share-popover {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 320px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-popover);
  padding: 14px;
  z-index: 300;
}
.share-url-input {
  width: 100%;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 10px;
  font-size: 12px;
  color: var(--muted);
  background: var(--chip);
  margin-bottom: 10px;
  box-sizing: border-box;
  cursor: text;
}
.share-url-input:focus { outline: none; }
.share-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.share-chip {
  display: inline-block;
  padding: 3px 10px;
  background: var(--ice);
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--navy);
}
.share-actions { display: flex; justify-content: flex-end; }
.btn-copy-link {
  height: 34px;
  padding: 0 16px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn-copy-link:hover { background: #0e284a; }
.btn-copy-link.is-success { background: #2a7c4f; }
.btn-copy-link:focus-visible { outline: 3px solid #6cc0e5; outline-offset: 2px; }

/* =========================================================
   Cards
   ========================================================= */
.card {
  display: block;
  width: 100%;
  padding: 10px 16px 11px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: #fff;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
}

.card:hover { background: var(--chip); }

.card.is-active {
  background: var(--ice);
  box-shadow: inset 3px 0 0 var(--navy);
}

.card__top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 1px;
}

.card__name {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card__distance {
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}

.card__region {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.card__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

/* Base tag */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  background: var(--chip);
  color: var(--ink);
}

/* Grooming tag */
.tag--groom { background: var(--chip); }

.tag__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* km tag */
.tag--km { background: var(--chip); color: var(--muted); font-weight: 400; }

/* Snowmaking tag */
.tag--snow { background: var(--ice); color: var(--navy); }

/* Lit at night tag */
.tag--lit { background: var(--warm-bg); color: var(--warm-fg); }

/* =========================================================
   Results header subtitle
   ========================================================= */
.results-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}

/* =========================================================
   Empty / more state
   ========================================================= */
.listing-empty {
  padding: 32px 16px;
  text-align: center;
  font-size: 15px;
  color: var(--muted);
  line-height: 1.5;
}

.listing-more {
  padding: 12px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
}

.btn-clear-filters {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-clear-filters:hover { background: var(--chip); }

/* =========================================================
   Skeleton loading cards
   ========================================================= */
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

.skeleton {
  display: block;
  padding: 10px 16px 11px;
  border-bottom: 1px solid var(--line);
}

.skeleton__line {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, #e8ecef 25%, #f4f6f7 50%, #e8ecef 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s infinite linear;
  margin-bottom: 8px;
}

.skeleton__line--name  { width: 65%; height: 14px; margin-bottom: 6px; }
.skeleton__line--region{ width: 40%; margin-bottom: 8px; }
.skeleton__line--tags  { width: 80%; height: 20px; border-radius: var(--radius-pill); }

/* =========================================================
   Map
   ========================================================= */
#map {
  flex: 999 1 560px;
  min-width: 0;
  position: relative;
}

/* =========================================================
   Mapbox overrides
   ========================================================= */
.mapboxgl-popup-content {
  padding: 12px 16px;
  font-size: 14px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  border-top: 3px solid var(--navy);
  border-radius: 0 0 var(--radius-input) var(--radius-input);
}

.mapboxgl-popup-close-button {
  font-size: 20px;
  padding: 4px 8px;
  color: var(--muted);
}

/* =========================================================
   Filter chip wraps + popovers
   ========================================================= */
.chip-wrap {
  position: relative;
}

.popover {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 220px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-popover);
  z-index: 100;
  display: none;
}

.popover.is-open { display: block; }

.popover__body { padding: 12px 16px 4px; }

.popover__footer {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
}

.popover-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}

.popover-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--navy);
  cursor: pointer;
  flex-shrink: 0;
  margin: 0;
}

.btn-show-areas {
  width: 100%;
  height: 34px;
  border: none;
  border-radius: var(--radius-pill);
  background: var(--navy);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-show-areas:hover { background: #0d2845; }

.chip--clear {
  background: var(--chip);
  border-color: var(--chip);
  color: var(--ink);
  font-weight: 400;
}

.chip--clear:hover { background: var(--line); border-color: var(--line); }

/* =========================================================
   Trail length histogram + dual-range slider
   ========================================================= */
.tl-wrap { margin-bottom: 4px; }

.tl-histogram {
  display: flex;
  align-items: flex-end;
  height: 44px;
  gap: 2px;
  margin-bottom: 4px;
}

.tl-bar {
  flex: 1;
  min-height: 0;
  border-radius: 2px 2px 0 0;
  background: #e4e8ec;
  transition: background 0.15s;
}

.tl-track-outer {
  position: relative;
  height: 20px;
}

.tl-track-bg {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  pointer-events: none;
}

.tl-fill {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 6px;
  background: var(--navy);
  border-radius: 3px;
  pointer-events: none;
  left: 0;
  right: 0;
}

.tl-range {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0; left: 0;
  margin: 0; padding: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  pointer-events: none;
}

.tl-range::-webkit-slider-runnable-track { background: transparent; height: 6px; }
.tl-range::-moz-range-track { background: transparent; height: 6px; }

.tl-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--navy);
  pointer-events: auto;
  cursor: grab;
  margin-top: -6px;
  box-shadow: 0 1px 4px rgba(18,33,47,.2);
}

.tl-range::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--navy);
  pointer-events: auto;
  cursor: grab;
  box-shadow: 0 1px 4px rgba(18,33,47,.2);
}

.tl-range:focus { outline: none; }

.tl-range:focus-visible::-webkit-slider-thumb {
  outline: 3px solid #6cc0e5;
  outline-offset: 2px;
}

.tl-range--top { z-index: 2; }

/* =========================================================
   Map overlays: sync switch, nav controls, legend
   ========================================================= */
#map { position: relative; }

.sync-switch-wrap {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  background: #fff;
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  box-shadow: var(--shadow-control);
  white-space: nowrap;
}

.sync-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  user-select: none;
}

.sync-label input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--navy);
  cursor: pointer;
  margin: 0;
}

.nav-controls {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-btn {
  width: 44px;
  height: 44px;
  background: #fff;
  border: none;
  border-radius: 6px;
  box-shadow: var(--shadow-control);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  cursor: pointer;
}

.nav-btn:hover { background: var(--chip); }

.nav-btn:focus-visible {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
}

.map-legend {
  position: absolute;
  bottom: 30px;
  left: 10px;
  z-index: 10;
  background: #fff;
  border-radius: var(--radius-panel);
  padding: 10px 12px;
  box-shadow: var(--shadow-control);
  font-size: 13px;
}

.map-legend__item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
}

.map-legend__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
}

/* Step 12/13 — overlay button (color mode + trails toggle) */
.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.nav-btn.is-active {
  background: var(--navy);
  color: #fff;
}
.nav-btn.is-active:hover { background: #0e284a; }

/* Snow legend (Step 12) */
.map-legend__title {
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
  font-size: 12px;
}
.map-legend__row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
  font-size: 12px;
  color: var(--muted);
}
.map-legend__swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.15);
}

/* Pin hover → card highlight */
.card.is-pin-hover {
  background: var(--ice);
  box-shadow: inset 3px 0 0 var(--navy);
}

/* =========================================================
   Mobile toggle bar (hidden on desktop)
   ========================================================= */
.mobile-toggle {
  display: none;
}

/* =========================================================
   Narrow viewports: stacked layout with map/list toggle
   ========================================================= */
@media (max-width: 760px) {
  /* Toggle bar */
  .mobile-toggle {
    display: flex;
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 6px 12px;
    gap: 6px;
  }

  .mobile-toggle__btn {
    flex: 1;
    height: 36px;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    background: #fff;
    color: var(--navy);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
  }

  .mobile-toggle__btn--active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

  /* Stacked layout */
  body { overflow: auto; }
  .main-body {
    flex-direction: column;
    flex-wrap: nowrap;
    overflow: visible;
    height: auto;
  }

  /* Sidebar fills full width; hide when map tab active */
  .sidebar {
    flex: none;
    max-width: 100%;
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

  .sidebar.mobile-hidden { display: none; }

  /* Map fills full width; hide when list tab active */
  #map {
    flex: none;
    width: 100%;
    min-height: 55vh;
  }

  #map.mobile-hidden { display: none; }

  /* Map view: lock body to viewport so map fills remaining space exactly */
  body.mobile-map-view {
    overflow: hidden;
    height: 100dvh;
  }

  body.mobile-map-view .main-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  body.mobile-map-view #map {
    flex: 1;
    min-height: 0;
    height: auto;
  }

  /* Header: 2-row layout — brand+share on top, search full-width below */
  .site-header {
    flex-wrap: wrap;
    height: auto;
    padding: 8px 12px;
    gap: 6px;
  }

  .site-header__brand { flex: 1; }

  .site-header__search {
    order: 3;
    flex: 0 0 100%;
    max-width: 100%;
    margin: 0;
  }

  .site-header__tagline { display: none; }

  /* Search listbox: cap height relative to viewport */
  .search-listbox { max-height: min(280px, 40vh); }

  /* Share popover: fit within viewport */
  .share-popover {
    width: calc(100vw - 24px);
    max-width: 320px;
    left: auto;
    right: 0;
  }

  /* Touch targets: search buttons */
  .search-geo-btn {
    width: 44px;
    height: 44px;
    right: 0;
  }

  .search-clear-btn {
    width: 36px;
    height: 36px;
    right: 40px;
  }

  /* Compensate padding so text isn't hidden behind enlarged buttons */
  .search-input { padding-right: 80px; }
  .search-input-wrap--has-value .search-input { padding-right: 80px; }

  /* In list view, sidebar grows to content height so the body scrolls */
  .sidebar { overflow: visible; }
  .listing { flex: 0 0 auto; overflow-y: visible; }
  .detail-panel { flex: 0 0 auto; overflow-y: visible; }
}

/* =========================================================
   Step 13 — OpenSkiMap link in detail panel
   ========================================================= */
.detail-external-link {
  display: block;
  margin-top: 16px;
  font-size: 14px;
  color: var(--link);
  text-decoration: none;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.detail-external-link:hover { text-decoration: underline; }

/* =========================================================
   Step 10 — Favorites
   ========================================================= */
.card__star {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--muted);
  cursor: pointer;
  padding: 0 0 0 4px;
  line-height: 1;
  flex-shrink: 0;
  transition: color 0.1s;
}
.card__star:hover { color: #f5c842; }
.card__star.is-favorited { color: #f5c842; }
.card__star:focus-visible { outline: 2px solid #6cc0e5; border-radius: 4px; }

.btn-favorite {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 18px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  background: #fff;
  color: var(--navy);
  border: 1px solid var(--line);
  cursor: pointer;
}
.btn-favorite.is-favorited { background: var(--ice); border-color: var(--navy); }
.btn-favorite:hover { border-color: var(--navy); background: var(--ice); }

/* =========================================================
   Step 11 — Recent Snow
   ========================================================= */
.tag--newsnow {
  background: #dbeeff;
  color: #0a4a8a;
}

.snow-window-chips { display: flex; gap: 6px; margin: 8px 0; }
.snow-win-btn {
  flex: 1;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.snow-win-btn.is-active { background: var(--navy); color: #fff; border-color: var(--navy); }
.snow-min-label { font-size: 13px; color: var(--muted); margin: 8px 0 4px; }

</style>
</head>

<script>

/* =================================================================
   Map setup
   ================================================================= */
mapboxgl.accessToken = 'pk.eyJ1IjoibW94eXBlZCIsImEiOiJjaWgydGpwdmYweHJydnFtMzZzOXpmNjg3In0.5TXWYv0Z7nsOZHneIQOhxg';

var map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v11',
  center: [-98, 38.88],
  minZoom: 1,
  zoom: 3
});

/* =================================================================
   State
   ================================================================= */
var state = {
  location:   null,       // { id, label, lat, lng } — set in Step 6
  filters: {
    skate:      false,    // groomed for skate
    classic:    false,    // groomed for classic
    snow:       false,    // snowmaking
    lit:        false,    // lit at night
    kmMin:      0,        // trail length min (km)
    kmMax:      100,      // trail length max; 100 = "100+" (no upper limit)
    snowMinIn:  0         // minimum new snowfall in inches (Step 11)
  },
  sort:        'name',    // 'name' | 'dist' | 'kmDesc' | 'kmAsc' | 'groom' | 'snow'
  sync:        true,      // list follows map view
  selectedId:  null,      // open area id
  favorites:     false,   // filter: show only favorites (Step 10)
  snowWindow:    24,      // snow time window in hours: 6|12|24|48 (Step 11)
  mapColorMode: 'groom'   // 'groom' | 'snow' (Step 12)
};

var allFeatures     = [];
var visibleFeatures = [];  // features in current map bounds (unique by id)
var fullGeoJSON     = null;
var sourceIsFiltered = false;
var lastFilterKey    = '';
var dataLoaded       = false;

/* Trail run data — lazy-loaded once on first area selection */
var runsGeoJSON      = null;   // full feature collection after first load
var runsLoading      = false;  // guard against concurrent fetches

/* --- URL → state (runs immediately; map/area applied after data loads) --- */
var pendingMapParam  = null;
var pendingAreaParam = null;

(function () {
  if (!location.search) return;
  var params = new URLSearchParams(location.search);

  var near = params.get('near');
  if (near) {
    var np = near.match(/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?),(.+)$/);
    if (np) {
      var nLat = parseFloat(np[1]), nLng = parseFloat(np[2]);
      if (!isNaN(nLat) && !isNaN(nLng)) {
        state.location = { lnglat: [nLng, nLat], label: decodeURIComponent(np[3]) };
      }
    }
  }

  var groom = params.get('groom');
  if (groom) {
    var gp = groom.split(',');
    state.filters.skate   = gp.indexOf('skate')   !== -1;
    state.filters.classic = gp.indexOf('classic') !== -1;
  }
  if (params.get('snow') === 'yes') state.filters.snow = true;
  if (params.get('lit')  === 'yes') state.filters.lit  = true;

  var km = params.get('km');
  if (km) {
    var kp = km.match(/^(\d+)-(\d*)$/);
    if (kp) {
      var kMin = parseInt(kp[1], 10), kMax = kp[2] === '' ? 100 : parseInt(kp[2], 10);
      if (!isNaN(kMin) && !isNaN(kMax)) {
        state.filters.kmMin = Math.max(0, Math.min(100, kMin));
        state.filters.kmMax = Math.max(0, Math.min(100, kMax));
      }
    }
  }

  var sortVal = params.get('sort');
  var VALID_SORTS = ['name', 'dist', 'kmDesc', 'kmAsc', 'groom', 'snow'];
  if (sortVal && VALID_SORTS.indexOf(sortVal) !== -1) state.sort = sortVal;
  if (params.get('sync') === 'off') state.sync = false;

  pendingMapParam  = params.get('map');
  pendingAreaParam = params.get('area');
  if (params.get('fav') === '1') state.favorites = true;
}());

/* =================================================================
   DOM refs
   ================================================================= */
var listingEl   = document.getElementById('feature-listing');
var countEl     = document.getElementById('result-count');
var subtitleEl  = document.getElementById('result-subtitle');
var sortEl      = document.getElementById('sort-select');

var popup = new mapboxgl.Popup({ closeButton: false });

/* =================================================================
   URL sync + localStorage (Step 8)
   ================================================================= */
var urlSyncTimer  = null;
var STORAGE_KEY   = 'nsc:v1:lastSearch';

/* =================================================================
   Step 10 — Favorites persistence
   ================================================================= */
var FAVORITES_KEY = 'nsc:v1:favorites';
var favoriteIds   = new Set();
(function () {
  try {
    var raw = localStorage.getItem(FAVORITES_KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) favoriteIds = new Set(arr);
    }
  } catch (e) {}
}());

function saveFavorites() {
  try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favoriteIds))); } catch (e) {}
}

/* =================================================================
   Step 11 — Snow data cache
   ================================================================= */
var snowCache = {};
// snowCache[areaId] = { fetchedAt, snowfall6h, snowfall12h, snowfall24h, snowfall48h, depthIn }
// or { fetchedAt, error: true } on fetch failure

function buildQueryString() {
  var p = [];
  var f = state.filters;

  if (state.location && state.location.label !== 'My location') {
    var lat = state.location.lnglat[1].toFixed(6);
    var lng = state.location.lnglat[0].toFixed(6);
    p.push('near=' + lat + ',' + lng + ',' + encodeURIComponent(state.location.label));
  }

  var groomParts = [];
  if (f.skate)   groomParts.push('skate');
  if (f.classic) groomParts.push('classic');
  if (groomParts.length) p.push('groom=' + groomParts.join(','));
  if (f.snow) p.push('snow=yes');
  if (f.lit)  p.push('lit=yes');
  if (f.kmMin > 0 || f.kmMax < 100) {
    p.push('km=' + f.kmMin + '-' + (f.kmMax >= 100 ? '' : f.kmMax));
  }

  if (state.sort !== 'name') p.push('sort=' + state.sort);

  if (typeof map !== 'undefined') {
    try {
      var c = map.getCenter();
      var z = map.getZoom();
      p.push('map=' + c.lat.toFixed(4) + ',' + c.lng.toFixed(4) + ',' + z.toFixed(1));
    } catch (e) {}
  }

  if (state.favorites) p.push('fav=1');
  if (!state.sync) p.push('sync=off');
  if (state.selectedId) p.push('area=' + encodeURIComponent(state.selectedId));

  return p.length ? '?' + p.join('&') : location.pathname;
}

function syncUrl() {
  history.replaceState(null, '', buildQueryString());
}

function scheduleUrlSync() {
  clearTimeout(urlSyncTimer);
  urlSyncTimer = setTimeout(syncUrl, 300);
}

function saveToStorage() {
  if (!dataLoaded) return;
  if (state.location && state.location.label === 'My location') return;
  var saved = { location: state.location, filters: state.filters, sort: state.sort, sync: state.sync };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) {}
}

function isDefaultState(s) {
  if (s.location) return false;
  if (s.sort !== 'name') return false;
  if (s.sync === false) return false;
  var f = s.filters || {};
  return !f.skate && !f.classic && !f.snow && !f.lit && f.kmMin === 0 && f.kmMax === 100;
}

/* =================================================================
   Helpers
   ================================================================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isValid(val) {
  if (val === null || val === undefined) return false;
  var s = String(val).trim().toLowerCase();
  return s !== '' && s !== 'n/a' && s !== 'na' && s !== 'unknown' && s !== 'none';
}

/* =================================================================
   Filtering — reads from state.filters
   ================================================================= */
function hasActiveFilters() {
  var f = state.filters;
  return f.skate || f.classic || f.snow || f.lit || f.kmMin > 0 || f.kmMax < 100
      || state.favorites || f.snowMinIn > 0;
}

function featureMatchesFilters(feature) {
  var prop = feature.properties;
  var f    = state.filters;

  // Favorites filter (Step 10)
  if (state.favorites && !favoriteIds.has(prop.id)) return false;

  // Snow filter (Step 11)
  if (f.snowMinIn > 0) {
    var sc = snowCache[prop.id];
    if (!sc || sc.error) return false;
    if (snowInchesForWindow(sc, state.snowWindow) < f.snowMinIn) return false;
  }

  // Grooming: skate and/or classic must be true on the feature
  if (f.skate   && prop.groomSkate   !== true) return false;
  if (f.classic && prop.groomClassic !== true) return false;

  // Snowmaking / Lit
  if (f.snow && prop.Snowmaking !== 'Yes') return false;
  if (f.lit  && prop.Lit        !== 'Yes') return false;

  // Trail length
  var km = prop.km;
  if (f.kmMin > 0) {
    if (km === null) return false;
    if (km < f.kmMin) return false;
  }
  if (f.kmMax < 100) {
    if (km === null) return false;
    if (km > f.kmMax) return false;
  }

  return true;
}

/* =================================================================
   Sorting — reads from state.sort
   ================================================================= */
var GROOM_ORDER = { both: 0, skate: 1, classic: 2, yes: 3, unknown: 3 };

function sortFeatures(arr) {
  var sort = state.sort;
  return arr.slice().sort(function (a, b) {
    var ap = a.properties, bp = b.properties;
    var nameCmp = (ap.Name || '').localeCompare(bp.Name || '');

    if (sort === 'dist' && state.location) {
      return (ap._dist || 0) - (bp._dist || 0) || nameCmp;
    }
    if (sort === 'kmDesc') {
      if (ap.km === null && bp.km === null) return nameCmp;
      if (ap.km === null) return 1;
      if (bp.km === null) return -1;
      return bp.km - ap.km || nameCmp;
    }
    if (sort === 'kmAsc') {
      if (ap.km === null && bp.km === null) return nameCmp;
      if (ap.km === null) return 1;
      if (bp.km === null) return -1;
      return ap.km - bp.km || nameCmp;
    }
    if (sort === 'groom') {
      var ag = GROOM_ORDER[ap.groomType] !== undefined ? GROOM_ORDER[ap.groomType] : 3;
      var bg = GROOM_ORDER[bp.groomType] !== undefined ? GROOM_ORDER[bp.groomType] : 3;
      return ag - bg || nameCmp;
    }
    if (sort === 'snow') {
      return (ap.Snowmaking === 'Yes' ? 0 : 1) - (bp.Snowmaking === 'Yes' ? 0 : 1) || nameCmp;
    }
    // default: name
    return nameCmp;
  });
}

/* =================================================================
   Grooming dot color
   ================================================================= */
var GROOM_COLOR = { both: '#1b4f8a', skate: '#e07b24', classic: '#6cc0e5', unknown: '#9aa4ad', yes: '#9aa4ad' };
var GROOM_LABEL = { both: 'Skate + classic', skate: 'Skate only', classic: 'Classic only', unknown: 'Grooming unknown', yes: 'Grooming unknown' };

/* =================================================================
   Skeleton loading cards
   ================================================================= */
function renderSkeleton() {
  listingEl.innerHTML = '';
  for (var i = 0; i < 8; i++) {
    var sk = document.createElement('div');
    sk.className = 'skeleton';
    sk.innerHTML =
      '<div class="skeleton__line skeleton__line--name"></div>' +
      '<div class="skeleton__line skeleton__line--region"></div>' +
      '<div class="skeleton__line skeleton__line--tags"></div>';
    listingEl.appendChild(sk);
  }
  countEl.textContent = '';
  subtitleEl.textContent = '';
}

/* =================================================================
   Card render
   ================================================================= */
var CAP = 100;

function renderListings(features) {
  listingEl.innerHTML = '';

  /* --- Empty state --- */
  if (features.length === 0) {
    countEl.textContent = hasActiveFilters() ? '0 ski areas' : '';
    subtitleEl.textContent = state.location
      ? 'Distances from ' + state.location.label
      : 'Search a town or use your location to see distances';

    var wrap = document.createElement('div');
    wrap.className = 'listing-empty';
    if (hasActiveFilters()) {
      wrap.textContent = 'No ski areas here match your filters';
      var clrBtn = document.createElement('button');
      clrBtn.className = 'btn-clear-filters';
      clrBtn.textContent = 'Clear filters';
      clrBtn.addEventListener('click', clearFilters);
      wrap.appendChild(document.createElement('br'));
      wrap.appendChild(clrBtn);
    } else {
      wrap.textContent = 'Pan and zoom the map to explore ski areas';
    }
    listingEl.appendChild(wrap);
    return;
  }

  /* --- Results header --- */
  var zoom = map.getZoom();
  var countText = features.length + ' ski area' + (features.length !== 1 ? 's' : '');
  if (state.sync) {
    countText += zoom > 5 ? ' in this map view' : ' on the map';
  }
  countEl.textContent = countText;
  subtitleEl.textContent = state.location
    ? 'Distances from ' + state.location.label
    : 'Search a town or use your location to see distances';

  /* --- Sort --- */
  var sorted = sortFeatures(features);
  var capped = sorted.length > CAP;
  var toRender = capped ? sorted.slice(0, CAP) : sorted;

  /* --- Cards --- */
  toRender.forEach(function (feature) {
    var prop = feature.properties;
    var gt   = prop.groomType || 'unknown';

    var btn = document.createElement('button');
    btn.className = 'card' + (prop.id === state.selectedId ? ' is-active' : '');
    btn.type = 'button';
    btn.setAttribute('role', 'listitem');
    btn.dataset.id = prop.id;

    /* Top row: name + distance + star */
    var top = document.createElement('div');
    top.className = 'card__top';
    var nameEl = document.createElement('span');
    nameEl.className = 'card__name';
    nameEl.textContent = prop.Name;
    top.appendChild(nameEl);
    if (state.location && prop._dist != null) {
      var distEl = document.createElement('span');
      distEl.className = 'card__distance';
      distEl.textContent = formatDist(prop._dist);
      top.appendChild(distEl);
    }
    /* Star button (Step 10) */
    (function (featureId) {
      var starBtn = document.createElement('button');
      starBtn.type = 'button';
      var isFav = favoriteIds.has(featureId);
      starBtn.className = 'card__star' + (isFav ? ' is-favorited' : '');
      starBtn.setAttribute('aria-label', isFav ? 'Remove from favorites' : 'Add to favorites');
      starBtn.setAttribute('title', isFav ? 'Remove from favorites' : 'Add to favorites');
      starBtn.textContent = isFav ? '★' : '☆';
      starBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleFavorite(featureId, starBtn);
      });
      top.appendChild(starBtn);
    }(prop.id));
    btn.appendChild(top);

    /* Region */
    if (prop.region) {
      var regionEl = document.createElement('div');
      regionEl.className = 'card__region';
      regionEl.textContent = prop.region;
      btn.appendChild(regionEl);
    }

    /* Tags */
    var tags = document.createElement('div');
    tags.className = 'card__tags';

    // Grooming tag
    var groomTag = document.createElement('span');
    groomTag.className = 'tag tag--groom';
    var dot = document.createElement('span');
    dot.className = 'tag__dot';
    dot.style.background = GROOM_COLOR[gt] || GROOM_COLOR.unknown;
    groomTag.appendChild(dot);
    groomTag.appendChild(document.createTextNode(GROOM_LABEL[gt] || 'Grooming unknown'));
    tags.appendChild(groomTag);

    // km tag
    if (prop.km !== null && prop.km !== undefined) {
      var kmTag = document.createElement('span');
      kmTag.className = 'tag tag--km';
      kmTag.textContent = prop.km + ' km';
      tags.appendChild(kmTag);
    }

    // Snowmaking tag
    if (prop.Snowmaking === 'Yes') {
      var snowTag = document.createElement('span');
      snowTag.className = 'tag tag--snow';
      snowTag.textContent = 'Snowmaking';
      tags.appendChild(snowTag);
    }

    // Lit tag
    if (prop.Lit === 'Yes') {
      var litTag = document.createElement('span');
      litTag.className = 'tag tag--lit';
      litTag.textContent = 'Lit at night';
      tags.appendChild(litTag);
    }

    // Snow badge (Step 11)
    (function (featureId) {
      var snowBadge = document.createElement('span');
      snowBadge.className = 'tag tag--newsnow';
      snowBadge.id = 'snow-badge-' + featureId;
      var cachedSnow = snowCache[featureId];
      if (cachedSnow && !cachedSnow.error) {
        var snowIn = snowInchesForWindow(cachedSnow, state.snowWindow);
        if (snowIn > 0) {
          snowBadge.textContent = '❄ ' + snowIn.toFixed(1) + '"';
          tags.appendChild(snowBadge);
        }
      }
    }(prop.id));

    btn.appendChild(tags);

    /* Interactions */
    btn.addEventListener('mouseover', function () {
      setHover(prop.id);
    });
    btn.addEventListener('mouseout', function () {
      clearHover();
    });

    btn.addEventListener('click', function () {
      // Clear previous selected feature-state
      if (state.selectedId) {
        map.setFeatureState({ source: 'nordic-ski-areas', id: state.selectedId }, { selected: false });
      }
      listingEl.querySelectorAll('.card').forEach(function (el) { el.classList.remove('is-active'); });
      btn.classList.add('is-active');
      state.selectedId = prop.id;
      map.setFeatureState({ source: 'nordic-ski-areas', id: prop.id }, { selected: true });
      openDetailPanel(feature);
    });

    listingEl.appendChild(btn);
  });

  /* "Zoom in to see more" row */
  if (capped) {
    var more = document.createElement('div');
    more.className = 'listing-more';
    more.textContent = 'Showing 100 of ' + sorted.length + ' areas. Zoom in to see fewer.';
    listingEl.appendChild(more);
  }

  /* Kick off snow data loading for visible features (Step 11) */
  loadSnowForVisible(features);
}

/* =================================================================
   Step 5: Map restyle — hover/selection helpers, nav controls, sync
   ================================================================= */
var hoveredId = null;
var dataBounds = null;

function setHover(id) {
  if (hoveredId === id) return;
  if (hoveredId !== null) {
    map.setFeatureState({ source: 'nordic-ski-areas', id: hoveredId }, { hover: false });
    listingEl.querySelectorAll('.card.is-pin-hover').forEach(function (el) {
      el.classList.remove('is-pin-hover');
    });
  }
  hoveredId = id;
  if (id !== null) {
    map.setFeatureState({ source: 'nordic-ski-areas', id: id }, { hover: true });
    var matchCard = listingEl.querySelector('[data-id="' + id + '"]');
    if (matchCard) matchCard.classList.add('is-pin-hover');
  }
}

function clearHover() {
  setHover(null);
}

/* Sync checkbox */
var syncCheckbox = document.getElementById('sync-checkbox');
if (syncCheckbox) {
  syncCheckbox.addEventListener('change', function () {
    state.sync = syncCheckbox.checked;
    if (state.sync) updateVisibleFeatures();
  });
}

/* Custom nav buttons */
var navZoomIn  = document.getElementById('nav-zoom-in');
var navZoomOut = document.getElementById('nav-zoom-out');
var navFit     = document.getElementById('nav-fit');

if (navZoomIn)  navZoomIn.addEventListener('click',  function () { map.zoomIn(); });
if (navZoomOut) navZoomOut.addEventListener('click', function () { map.zoomOut(); });
if (navFit) {
  navFit.addEventListener('click', function () {
    if (dataBounds) {
      map.fitBounds(dataBounds, { padding: 40 });
    } else {
      map.flyTo({ center: [-98, 47], zoom: 3.5 });
    }
  });
}

/* =================================================================
   Distance formatting (haversine — location added in Step 6)
   ================================================================= */
function formatDist(miles) {
  if (miles < 10) return (Math.round(miles * 10) / 10) + ' mi';
  return Math.round(miles) + ' mi';
}

/* =================================================================
   Clear filters
   ================================================================= */
function clearFilters() {
  state.filters = { skate: false, classic: false, snow: false, lit: false, kmMin: 0, kmMax: 100, snowMinIn: 0 };
  state.favorites = false;
  // Sync filter DOM elements (defined in Step 4 JS below; safe at runtime)
  if (filterSkateEl)   filterSkateEl.checked   = false;
  if (filterClassicEl) filterClassicEl.checked = false;
  if (filterLitEl)     filterLitEl.checked     = false;
  if (chipSnowEl)      chipSnowEl.setAttribute('aria-pressed', 'false');
  if (tlMinEl)         tlMinEl.value            = '0';
  if (tlMaxEl)         tlMaxEl.value            = '100';
  if (typeof updateTrackFill === 'function') updateTrackFill();
  // Reset snow slider
  var snowSliderEl = document.getElementById('snow-min-slider');
  var snowReadoutEl = document.getElementById('snow-min-readout');
  if (snowSliderEl) snowSliderEl.value = '0';
  if (snowReadoutEl) snowReadoutEl.textContent = '0"';
  applyFilters();
}

/* =================================================================
   Apply filters + update map source
   ================================================================= */
function applyFilters() {
  if (typeof updateFilterChipStates === 'function') updateFilterChipStates();
  if (typeof updateHistogram === 'function') updateHistogram();

  var filtered = (state.sync ? visibleFeatures : allFeatures).filter(featureMatchesFilters);

  renderListings(filtered);

  /* Update map source so clusters count only matching features */
  var filterKey = JSON.stringify(state.filters);
  var active    = hasActiveFilters();

  if (active && fullGeoJSON && filterKey !== lastFilterKey) {
    var allFiltered = allFeatures.filter(featureMatchesFilters);
    map.getSource('nordic-ski-areas').setData({ type: 'FeatureCollection', features: allFiltered });
    sourceIsFiltered = true;
    lastFilterKey    = filterKey;
  } else if (!active && sourceIsFiltered && fullGeoJSON) {
    map.getSource('nordic-ski-areas').setData(fullGeoJSON);
    sourceIsFiltered = false;
    lastFilterKey    = '';
  }

  map.setFilter('unclustered-point',         ['!', ['has', 'point_count']]);
  map.setFilter('unclustered-point-hitarea', ['!', ['has', 'point_count']]);
  map.setFilter('unclustered-point-label',   ['!', ['has', 'point_count']]);

  scheduleUrlSync();
  saveToStorage();
}

/* =================================================================
   Visible-feature update (runs on moveend)
   ================================================================= */
function getUniqueById(arr) {
  var seen = {};
  return arr.filter(function (f) {
    var k = f.properties.id;
    if (seen[k]) return false;
    seen[k] = true;
    return true;
  });
}

function updateVisibleFeatures() {
  if (!dataLoaded) return;
  var bounds = map.getBounds();
  var visible = allFeatures.filter(function (f) {
    var c = f.geometry.coordinates;
    return bounds.contains([c[0], c[1]]);
  });
  visibleFeatures = getUniqueById(visible);
  applyFilters();
}

});

    cluster: true,
    clusterMaxZoom: 10,
    clusterRadius: 40,
    clusterMinPoints: 6,
    promoteId: 'id'
  });

  fetch('data/nordic-ski-areas-merged.geojson')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      fullGeoJSON = data;
      allFeatures = data.features;
      dataLoaded  = true;

      // Compute bounding box of all features for the "fit" nav button
      if (allFeatures.length) {
        var lngs = allFeatures.map(function (f) { return f.geometry.coordinates[0]; });
        var lats = allFeatures.map(function (f) { return f.geometry.coordinates[1]; });
        dataBounds = [
          [Math.min.apply(null, lngs), Math.min.apply(null, lats)],
          [Math.max.apply(null, lngs), Math.max.apply(null, lats)]
        ];
      }

      // Restore distances if location came from URL or localStorage
      if (state.location) {
        computeDistances(state.location.lnglat);

      if (sortEl && state.sort !== 'dist') sortEl.value = state.sort;

var tlMaxEl          = document.getElementById('tl-max');
var tlFillEl         = document.getElementById('tl-fill');
var tlReadoutEl      = document.getElementById('trail-length-readout');
var tlHistEl         = document.getElementById('tl-histogram');

/* ---- Histogram ---- */

// Build 20 empty bar elements once
(function () {
  for (var i = 0; i < 20; i++) {
    var bar = document.createElement('div');
    bar.className = 'tl-bar';
    tlHistEl.appendChild(bar);
  }
}());

function featureMatchesNonKmFilters(feature) {
  var prop = feature.properties;
  var f    = state.filters;
  if (f.skate   && prop.groomSkate   !== true) return false;
  if (f.classic && prop.groomClassic !== true) return false;
  if (f.snow    && prop.Snowmaking   !== 'Yes') return false;
  if (f.lit     && prop.Lit          !== 'Yes') return false;
  return true;
}

function updateHistogram() {
  var pool    = state.sync ? visibleFeatures : allFeatures;
  var buckets = new Array(20).fill(0);

  pool.forEach(function (f) {
    if (!featureMatchesNonKmFilters(f)) return;
    var km = f.properties.km;
    if (km === null || km === undefined) return;
    var b = Math.min(Math.floor(km / 5), 19);
    buckets[b]++;
  });

  var peak  = Math.max.apply(null, buckets) || 1;
  var kmMin = state.filters.kmMin;
  var kmMax = state.filters.kmMax;
  var bars  = tlHistEl.querySelectorAll('.tl-bar');

  bars.forEach(function (bar, i) {
    var lo    = i * 5;
    var hi    = lo + 5;
    var count = buckets[i];
    var h     = count === 0 ? 0 : Math.max(5, Math.round((count / peak) * 44));
    bar.style.height = h + 'px';

    var aboveMin = hi > kmMin;
    var belowMax = kmMax >= 100 || lo < kmMax;
    var inRange  = aboveMin && belowMax;
    bar.style.background = (count > 0 && inRange) ? '#7fa6c9' : '#e4e8ec';
  });
}

/* ---- Trail length slider ---- */

function updateTrackFill() {
  var min = state.filters.kmMin;
  var max = state.filters.kmMax;
  tlFillEl.style.left  = min + '%';
  tlFillEl.style.right = (100 - max) + '%';

  if (min === 0 && max >= 100) {
    tlReadoutEl.textContent = 'Any length';
  } else if (max >= 100) {
    tlReadoutEl.textContent = min + ' km – 100+ km';
  } else {
    tlReadoutEl.textContent = min + ' km – ' + max + ' km';
  }

  // When both handles crowd the right end, raise min so it can slide back left
  tlMinEl.classList.toggle('tl-range--top', min >= 95 && max >= 100);
}

tlMinEl.addEventListener('input', function () {
  var minVal = parseInt(tlMinEl.value, 10);
  var maxVal = parseInt(tlMaxEl.value, 10);
  if (minVal >= maxVal) { minVal = maxVal - 5; tlMinEl.value = minVal; }
  state.filters.kmMin = Math.max(0, minVal);
  updateTrackFill();
  updateHistogram();
  applyFilters();
});

tlMaxEl.addEventListener('input', function () {
  var minVal = parseInt(tlMinEl.value, 10);
  var maxVal = parseInt(tlMaxEl.value, 10);
  if (maxVal <= minVal) { maxVal = minVal + 5; tlMaxEl.value = maxVal; }
  state.filters.kmMax = Math.min(100, maxVal);
  updateTrackFill();
  updateHistogram();
  applyFilters();
});

updateTrackFill();

/* ---- Popover open / close ---- */

var openPopover = null;

function closeAllPopovers() {
  [popoverGroomEl, popoverMoreEl].forEach(function (p) {
    p.classList.remove('is-open');
  });
  chipGroomingEl.setAttribute('aria-expanded', 'false');
  chipMoreEl.setAttribute('aria-expanded', 'false');
  openPopover = null;
}

function togglePopover(popoverEl, chipEl, showBtn) {
  var willOpen = !popoverEl.classList.contains('is-open');
  closeAllPopovers();
  if (willOpen) {
    popoverEl.classList.add('is-open');
    chipEl.setAttribute('aria-expanded', 'true');
    openPopover = popoverEl;
    if (showBtn) updateShowButton(showBtn);
  }
}

document.addEventListener('click', function (e) {
  if (!openPopover) return;
  if (openPopover.contains(e.target)) return;
  if (chipGroomingEl.contains(e.target)) return;
  if (chipMoreEl.contains(e.target)) return;
  closeAllPopovers();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && openPopover) {
    var chip = openPopover === popoverGroomEl ? chipGroomingEl : chipMoreEl;
    closeAllPopovers();
    chip.focus();
  }
});

/* ---- Grooming popover ---- */

chipGroomingEl.addEventListener('click', function () {
  togglePopover(popoverGroomEl, chipGroomingEl, btnShowGroomEl);
});

function updateGroomingChip() {
  var s = state.filters.skate;
  var c = state.filters.classic;

filterSkateEl.addEventListener('change', function () {

filterClassicEl.addEventListener('change', function () {

btnShowGroomEl.addEventListener('click', function () {

chipSnowEl.addEventListener('click', function () {

   ================================================================= */

var detailPanelEl   = document.getElementById('detail-panel');
var detailBackEl    = document.getElementById('detail-back');
var dpNameEl        = document.getElementById('dp-name');
var dpRegionEl      = document.getElementById('dp-region');
var dpDirectionsEl  = document.getElementById('dp-directions');
var dpWebsiteEl     = document.getElementById('dp-website');
var dpGridEl        = document.getElementById('dp-grid');
var dpNotesEl       = document.getElementById('dp-notes');
var resultsHeaderEl = document.querySelector('.results-header');

var listScrollTop = 0;

var GROOM_COLORS = { both: '#1b4f8a', skate: '#e07b24', classic: '#6cc0e5', unknown: '#9aa4ad' };

function groomDisplayInfo(prop) {
  var sk = prop.groomSkate   === true || prop.groomSkate   === 'true';
  var cl = prop.groomClassic === true || prop.groomClassic === 'true';
  if (sk && cl) return { label: 'Skate + classic', color: GROOM_COLORS.both };
  if (sk)       return { label: 'Skate only',       color: GROOM_COLORS.skate };
  if (cl)       return { label: 'Classic only',     color: GROOM_COLORS.classic };
  return        { label: 'Unknown',                 color: GROOM_COLORS.unknown };
}

function isValidUrl(s) {
  try { var u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; }
  catch (e) { return false; }
}

function openDetailPanel(feature) {
  var prop = feature.properties;

  listScrollTop = listingEl.scrollTop;

  // Name
  dpNameEl.textContent = prop.Name || '';

  // Region + distance
  var regionParts = [];
  if (prop.region) regionParts.push(prop.region);
  if (state.location && prop._dist != null) regionParts.push(formatDist(prop._dist) + ' away');
  dpRegionEl.textContent = regionParts.join(' · ');

  // Directions
  var lat = feature.geometry.coordinates[1];
  var lng = feature.geometry.coordinates[0];
  dpDirectionsEl.setAttribute('href',
    'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng);

  // Website
  if (prop.URL && isValidUrl(prop.URL)) {
    dpWebsiteEl.setAttribute('href', prop.URL);
    dpWebsiteEl.style.display = '';
  } else {
    dpWebsiteEl.style.display = 'none';
  }

  // Fact grid
  dpGridEl.innerHTML = '';

  function addGridItem(label, valueEl) {
    var item = document.createElement('div');
    item.className = 'detail-grid__item';
    item.setAttribute('role', 'listitem');
    var lbl = document.createElement('div');
    lbl.className = 'detail-grid__label';
    lbl.textContent = label;
    item.appendChild(lbl);
    item.appendChild(valueEl);
    dpGridEl.appendChild(item);
  }

  function textValue(text) {
    var el = document.createElement('div');
    el.className = 'detail-grid__value';
    el.textContent = text;
    return el;
  }

  // Trail length — use our curated km if present, fall back to skimap stats
  var km = prop.km != null ? prop.km : (prop.skimapKm || null);
  var skKm = prop.kmSkate;
  var clKm = prop.kmClassic;
  var kmDisplay;
  if (km != null) {
    var parts = [];
    if (skKm != null) parts.push(skKm + ' km skate');
    if (clKm != null) parts.push(clKm + ' km classic');
    kmDisplay = parts.length ? parts.join(', ') : km + ' km';
  } else {
    kmDisplay = '—';
  }
  addGridItem('Trail length', textValue(kmDisplay));

  // Grooming
  var groomInfo = groomDisplayInfo(prop);
  var groomVal  = document.createElement('div');
  groomVal.className = 'detail-grid__value';
  var dot = document.createElement('span');
  dot.className = 'detail-grid__dot';
  dot.style.background = groomInfo.color;
  var groomText = document.createTextNode(groomInfo.label);
  groomVal.appendChild(dot);
  groomVal.appendChild(groomText);
  addGridItem('Grooming', groomVal);

  // Snowmaking
  addGridItem('Snowmaking', textValue(prop.Snowmaking === 'Yes' ? 'Yes' : 'No'));

  // Lit at night
  addGridItem('Lit at night', textValue(prop.Lit === 'Yes' ? 'Yes' : 'No'));

  // Optional fields — only when data exists
  if (isValid(prop.passPrice)) addGridItem('Day pass',        textValue(prop.passPrice));
  if (isValid(prop.rentals))   addGridItem('Rentals',         textValue(prop.rentals));
  if (isValid(prop.lessons))   addGridItem('Lessons',         textValue(prop.lessons));
  if (isValid(prop.dogs))      addGridItem('Dogs on trails',  textValue(prop.dogs));

  // Notes
  if (isValid(prop.Notes)) {
    dpNotesEl.textContent = prop.Notes;
    dpNotesEl.style.display = '';
  } else {
    dpNotesEl.style.display = 'none';
  }

  // OpenSkiMap link (Step 13)
  var existingOsmLink = document.getElementById('dp-osm-link');
  if (existingOsmLink) existingOsmLink.remove();
  var dpNotesParent = dpNotesEl.parentNode;
  var osmLinkEl = document.createElement('a');
  osmLinkEl.id = 'dp-osm-link';
  osmLinkEl.href = 'https://openskimap.org/#12/' + lat.toFixed(4) + '/' + lng.toFixed(4);
  osmLinkEl.target = '_blank';
  osmLinkEl.rel = 'noopener noreferrer';
  osmLinkEl.className = 'detail-external-link';
  osmLinkEl.textContent = 'View trails on OpenSkiMap →';
  dpNotesParent.appendChild(osmLinkEl);

  // Favorite button in detail panel (Step 10)
  var dpStarBtn = document.getElementById('dp-star-btn');
  if (dpStarBtn) {
    var isFavDetail = favoriteIds.has(prop.id);
    dpStarBtn.textContent = isFavDetail ? '★ Saved' : '☆ Save';
    dpStarBtn.className = 'btn-favorite' + (isFavDetail ? ' is-favorited' : '');
    dpStarBtn.onclick = function () {
      toggleFavorite(prop.id, null);
      var nowFav = favoriteIds.has(prop.id);
      dpStarBtn.textContent = nowFav ? '★ Saved' : '☆ Save';
      dpStarBtn.className = 'btn-favorite' + (nowFav ? ' is-favorited' : '');
    };
  }

  // Show panel, hide list + results header
  listingEl.style.display = 'none';
  resultsHeaderEl.style.display = 'none';
  detailPanelEl.style.display = '';
  detailPanelEl.scrollTop = 0;

  // Fly to pin only if outside current view
  var coords = feature.geometry.coordinates;
  if (!map.getBounds().contains(coords)) {
    map.flyTo({ center: coords, zoom: 12 });
  }

  history.pushState({ areaId: prop.id }, '', buildQueryString());

  // Load trail lines for this area if it has a skimapId
  loadAreaRuns(prop.skimapId || null);
}

function loadAreaRuns(skimapId) {
  var src = map.getSource('selected-area-runs');
  if (!src) return;

  if (!skimapId) {
    src.setData({ type: 'FeatureCollection', features: [] });
    return;
  }

  function applyRuns(gj) {
    var filtered = gj.features.filter(function (f) {
      return f.properties.skiAreaId === skimapId;
    });
    src.setData({ type: 'FeatureCollection', features: filtered });
  }

  if (runsGeoJSON) {
    applyRuns(runsGeoJSON);
    return;
  }

  if (runsLoading) return; // another load in flight; it will re-apply when done
  runsLoading = true;

  fetch('data/nordic-ski-runs-na.geojson')
    .then(function (r) { return r.json(); })
    .then(function (gj) {
      runsGeoJSON = gj;
      runsLoading = false;
      applyRuns(gj);
    })
    .catch(function () {
      runsLoading = false;
    });
}

/* --- Haversine distance (miles) --- */
function haversine(lat1, lng1, lat2, lng2) {
  var R    = 3958.8;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a    = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
             Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
             Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* --- Stamp _dist on every feature from [lng, lat] --- */
function computeDistances(lnglat) {
  allFeatures.forEach(function (f) {
    var c = f.geometry.coordinates;
    f.properties._dist = haversine(lnglat[1], lnglat[0], c[1], c[0]);
  });
}

/* --- User location dot marker --- */
function placeUserMarker(lnglat) {
  if (userMarker) userMarker.remove();
  var el = document.createElement('div');
  el.className = 'user-location-dot';
  userMarker = new mapboxgl.Marker({ element: el, anchor: 'center' })
    .setLngLat(lnglat)
    .addTo(map);
}

/* --- Set location and switch to nearest sort --- */
function setLocation(lnglat, label) {
  state.location = { lnglat: lnglat, label: label };
  computeDistances(lnglat);
  placeUserMarker(lnglat);
  if (sortOptDistEl) sortOptDistEl.disabled = false;
  state.sort = 'dist';
  sortEl.value = 'dist';
  applyFilters();
}

/* --- Clear location --- */
function clearLocation() {
  if (!state.location) return;
  state.location = null;
  allFeatures.forEach(function (f) { delete f.properties._dist; });
  if (userMarker) { userMarker.remove(); userMarker = null; }
  if (state.sort === 'dist') {
    state.sort = 'name';
    sortEl.value = 'name';
    if (sortOptDistEl) sortOptDistEl.disabled = true;
  }
  applyFilters();
}

/* --- Escape HTML for rendering into innerHTML --- */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* --- Listbox open/close --- */
function openListbox(items) {
  suggestions = items;
  activeIdx   = -1;
  searchListboxEl.innerHTML = '';

  if (!items.length) { closeListbox(); return; }

  items.forEach(function (item, i) {
    var opt = document.createElement('div');
    opt.className = 'search-option';
    opt.setAttribute('role', 'option');
    opt.setAttribute('id', 'search-opt-' + i);
    opt.setAttribute('aria-selected', 'false');
    opt.innerHTML =
      '<span class="search-option__icon" aria-hidden="true">' +
        (item.type === 'area' ? '⛷' : '📍') +
      '</span>' +
      '<span class="search-option__label">' + escHtml(item.label) + '</span>';
    opt.addEventListener('mousedown', function (e) {
      e.preventDefault(); // keep focus on input
      pickSuggestion(i);
    });
    searchListboxEl.appendChild(opt);
  });

  searchListboxEl.style.display = '';
  locationSearchEl.setAttribute('aria-expanded', 'true');
  listboxOpen = true;
}

function closeListbox() {
  searchListboxEl.style.display = 'none';
  locationSearchEl.setAttribute('aria-expanded', 'false');
  locationSearchEl.removeAttribute('aria-activedescendant');
  listboxOpen = false;
  activeIdx   = -1;
}

function setActiveOption(i) {
  var opts = searchListboxEl.querySelectorAll('.search-option');
  if (activeIdx >= 0 && opts[activeIdx]) {
    opts[activeIdx].classList.remove('is-active');
    opts[activeIdx].setAttribute('aria-selected', 'false');
  }
  activeIdx = i;
  if (i >= 0 && opts[i]) {
    opts[i].classList.add('is-active');
    opts[i].setAttribute('aria-selected', 'true');
    locationSearchEl.setAttribute('aria-activedescendant', 'search-opt-' + i);
    opts[i].scrollIntoView({ block: 'nearest' });
  }
}

/* --- Pick a suggestion --- */
function pickSuggestion(i) {
  var item = suggestions[i];
  if (!item) return;
  locationSearchEl.value = item.label;
  searchClearEl.style.display = '';
  closeListbox();

  if (item.type === 'area') {
    if (state.selectedId) {
      map.setFeatureState({ source: 'nordic-ski-areas', id: state.selectedId }, { selected: false });
    }
    listingEl.querySelectorAll('.card').forEach(function (el) { el.classList.remove('is-active'); });
    state.selectedId = item.featureId;
    map.setFeatureState({ source: 'nordic-ski-areas', id: item.featureId }, { selected: true });
    map.flyTo({ center: item.coords, zoom: 12 });
    var fullFeature = allFeatures.find(function (f) { return f.properties.id === item.featureId; });
    if (fullFeature) openDetailPanel(fullFeature);
  } else {
    setLocation(item.coords, item.label);
    map.flyTo({ center: item.coords, zoom: 9 });
  }
}

/* --- Local ski-area name search (up to 3 results) --- */
function searchAreaNames(q) {
  var lower   = q.toLowerCase();
  var results = [];
  for (var i = 0; i < allFeatures.length && results.length < 3; i++) {
    var f    = allFeatures[i];
    var name = (f.properties.Name || '').toLowerCase();
    if (name.indexOf(lower) !== -1) {
      results.push({
        type:      'area',
        label:     f.properties.Name,
        coords:    f.geometry.coordinates,
        featureId: f.properties.id
      });
    }
  }
  return results;
}

/* --- Mapbox Geocoding API --- */
function geocode(q, callback) {
  var url = 'https://api.mapbox.com/geocoding/v5/mapbox.places/' +
    encodeURIComponent(q) +
    '.json?access_token=' + MAPBOX_TOKEN +
    '&types=place,district,postcode,locality,neighborhood,address' +
    '&country=us,ca&limit=4';
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var places = (data.features || []).slice(0, 4).map(function (f) {
        return { type: 'place', label: f.place_name, coords: f.geometry.coordinates };
      });
      callback(places);
    })
    .catch(function () { callback([]); });
}

/* --- Input events --- */
locationSearchEl.addEventListener('input', function () {
  var q = locationSearchEl.value.trim();
  searchClearEl.style.display = q ? '' : 'none';
  clearTimeout(geocodeTimer);
  if (!q) { closeListbox(); return; }

  var areaMatches = dataLoaded ? searchAreaNames(q) : [];
  if (areaMatches.length) openListbox(areaMatches); // show instantly

  geocodeTimer = setTimeout(function () {
    geocode(q, function (places) {
      openListbox(areaMatches.concat(places));
    });
  }, 280);
});

locationSearchEl.addEventListener('keydown', function (e) {
  if (!listboxOpen) return;
  var len = suggestions.length;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setActiveOption((activeIdx + 1) % len);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setActiveOption((activeIdx - 1 + len) % len);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIdx >= 0) pickSuggestion(activeIdx);
    else if (suggestions.length) pickSuggestion(0);
  } else if (e.key === 'Escape') {
    closeListbox();
  }
});

locationSearchEl.addEventListener('blur', function () {
  setTimeout(closeListbox, 150);
});

locationSearchEl.addEventListener('focus', function () {
  var q = locationSearchEl.value.trim();
  if (q && dataLoaded) {
    var areaMatches = searchAreaNames(q);
    if (areaMatches.length) openListbox(areaMatches);
  }
});

function initWelcomeBanner() {
  var raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (!raw) return;
  var saved;
  try { saved = JSON.parse(raw); } catch (e) { return; }
  if (!saved || isDefaultState(saved)) return;
  // Already restored from URL params — only show banner, don't overwrite URL state
  var hasUrlParams = !!(location.search);
  if (!hasUrlParams) {
    if (saved.location) state.location = saved.location;
    if (saved.filters)  state.filters  = saved.filters;
    if (saved.sort)     state.sort     = saved.sort;
    if (saved.sync === false) state.sync = false;
  }
  // Build banner text
  var parts = [];
  if (state.location && state.location.label) parts.push('Near ' + state.location.label);
  var f = state.filters;
  var groomParts = [];
  if (f.skate)   groomParts.push('skate');
  if (f.classic) groomParts.push('classic');
  if (groomParts.length) parts.push(groomParts.join(' & ') + ' groomed');
  if (f.snow)    parts.push('snowmaking');
  if (f.lit)     parts.push('lit at night');
  if (f.kmMin > 0 || f.kmMax < 100) {
    parts.push(f.kmMin + '–' + (f.kmMax >= 100 ? '∞' : f.kmMax) + ' km');
  }
  if (state.sort && state.sort !== 'name') parts.push('sorted by ' + state.sort);
  if (welcomeTextEl) {
    welcomeTextEl.textContent = parts.length
      ? 'Restored: ' + parts.join(', ')
      : 'Restored your last search settings.';
  }
  if (welcomeBannerEl) welcomeBannerEl.style.display = '';
  syncDomToState();
}

    btnMap.classList.remove('mobile-toggle__btn--active');
    document.body.classList.remove('mobile-map-view');
    // Move trail-length back into sidebar (before results-header)
    if (trailLengthEl && sidebarEl) {
      var resultsHeader = sidebarEl.querySelector('.results-header');
      if (resultsHeader) sidebarEl.insertBefore(trailLengthEl, resultsHeader);
    }
  }

  function showMap() {
    mapEl.classList.remove('mobile-hidden');
    sidebarEl.classList.add('mobile-hidden');
    btnMap.classList.add('mobile-toggle__btn--active');
    btnList.classList.remove('mobile-toggle__btn--active');
    document.body.classList.add('mobile-map-view');
    // Move trail-length to just before .main-body so it's always visible
    if (trailLengthEl && mainBodyEl) {
      mainBodyEl.parentNode.insertBefore(trailLengthEl, mainBodyEl);
    }
    // Resize map after layout settles
    if (typeof map !== 'undefined') setTimeout(function () { map.resize(); }, 0);
  }

  btnList.addEventListener('click', showList);
  btnMap.addEventListener('click', showMap);

  // When a map pin is clicked on mobile, switch to list/sidebar view
  window._mobileDetailHook = function () {
    if (window.innerWidth <= 760) showList();
  };

  // Set initial state on mobile: wait for map load event then switch to list view
  if (window.innerWidth <= 760) {
    var initToList = function() { showList(); };
    if (typeof map !== 'undefined') {
      if (map.loaded()) {
        initToList();
      } else {
        map.once('load', initToList);
      }
    }
  }
}());

initWelcomeBanner();

function updateFavoritePin() {
  if (!map.getLayer('favorites-star')) return;
  var favArr = Array.from(favoriteIds);
  if (favArr.length > 0) {
    map.setFilter('favorites-star', ['match', ['get', 'id'], favArr, true, false]);
  } else {
    map.setFilter('favorites-star', ['==', 'id', '___none___']);
  }
}

function toggleFavorite(id, starEl) {
  if (favoriteIds.has(id)) {
    favoriteIds.delete(id);
  } else {
    favoriteIds.add(id);
  }
  saveFavorites();
  var isFav = favoriteIds.has(id);
  if (starEl) {
    starEl.textContent = isFav ? '★' : '☆';
    starEl.className = 'card__star' + (isFav ? ' is-favorited' : '');
    starEl.setAttribute('aria-label', isFav ? 'Remove from favorites' : 'Add to favorites');
    starEl.setAttribute('title', isFav ? 'Remove from favorites' : 'Add to favorites');
  }
  if (state.favorites) applyFilters();
  updateFavoritePin();
}
