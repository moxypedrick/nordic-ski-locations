<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nordic Ski Centers</title>
<meta name="viewport" content="initial-scale=1,width=device-width" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.css" rel="stylesheet" />
<script data-goatcounter="https://nordic-centers.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>

/* =========================================================
   Design tokens
   ========================================================= */
:root {
  --navy:        #12355b;
  --ink:         #12212f;
  --muted:       #4d5d6c;
  --link:        #1d5f9e;
  --ice:         #e8f3fa;
  --line:        #e3e8ed;
  --chip:        #f1f4f7;
  --warm-bg:     #fdf0e3;
  --warm-fg:     #7a3d06;
  --water:       #cfe6f3;

  --radius-pill:  20px;
  --radius-panel: 12px;
  --radius-input: 8px;

  --shadow-popover: 0 10px 30px rgba(18,33,47,.16);
  --shadow-control: 0 2px 8px rgba(18,33,47,.18);
}

/* =========================================================
   Reset & base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================================================
   Header
   ========================================================= */
.site-header {
  height: 68px;
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 10;
}

.site-header__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  text-decoration: none;
  color: inherit;
}

.site-header__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.2;
}

.site-header__tagline {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.2;
}

.site-header__search {
  flex: 1;
  max-width: 620px;
  margin: 0 auto;
  position: relative;
}

.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  display: flex;
}

.search-input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 36px 0 38px;
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  appearance: none;
}

.search-input:focus {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
  border-color: var(--navy);
}

.search-input::placeholder { color: var(--muted); }

.site-header__actions { flex-shrink: 0; }

.btn-share {
  height: 36px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-share:hover { background: var(--chip); }

/* =========================================================
   Filter bar
   ========================================================= */
.filter-bar {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chip {
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}

.chip:hover { background: var(--chip); }

.chip[aria-pressed="true"],
.chip.is-active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

/* =========================================================
   Main body
   ========================================================= */
.main-body {
  display: flex;
  flex-wrap: wrap;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* =========================================================
   Sidebar
   ========================================================= */
.sidebar {
  flex: 1 1 380px;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: #fff;
  overflow: hidden;
  min-height: 0;
}

/* Trail length area (wired in Step 4) */
.trail-length-area {
  flex-shrink: 0;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}

.trail-length-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.trail-length-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.trail-length-readout {
  font-size: 14px;
  color: var(--muted);
}

.trail-length-track {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  margin-bottom: 6px;
}

.trail-length-axis {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* Results header */
.results-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  gap: 8px;
  min-height: 44px;
}

.results-count {
  font-size: 14px;
  color: var(--muted);
  flex: 1;
  min-width: 0;
}

.sort-select {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 8px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
  flex-shrink: 0;
}

.sort-select:focus {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
}

/* Feature listing */
.listing {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.listing.scrolled {
  box-shadow: inset 0 6px 6px -6px rgba(0,0,0,.1);
}

/* Listing items (redesigned in Step 3) */
.listing-item {
  display: block;
  width: 100%;
  padding: 10px 16px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: #fff;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
}

.listing-item:hover { background: var(--chip); }

.listing-item.is-active {
  background: var(--ice);
  border-left: 3px solid var(--navy);
  padding-left: 13px;
}

.listing-empty {
  padding: 32px 16px;
  text-align: center;
  font-size: 15px;
  color: var(--muted);
}

/* =========================================================
   Map
   ========================================================= */
#map {
  flex: 999 1 560px;
  min-width: 0;
  position: relative;
}

/* =========================================================
   Mapbox overrides
   ========================================================= */
.mapboxgl-popup-content {
  padding: 12px 16px;
  font-size: 14px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  border-top: 3px solid var(--navy);
  border-radius: 0 0 var(--radius-input) var(--radius-input);
}

.mapboxgl-popup-close-button {
  font-size: 20px;
  padding: 4px 8px;
  color: var(--muted);
}

/* =========================================================
   Narrow viewports: map wraps below sidebar
   ========================================================= */
@media (max-width: 940px) {
  body { overflow: auto; }
  .main-body { overflow: visible; }
  #map { min-height: 60vw; }
}

</style>
</head>
<body>

<!-- =========================================================
     Header
     ========================================================= -->
<header class="site-header">
  <a class="site-header__brand" href="/" aria-label="Nordic Ski Centers home">
    <!-- Logo mark: nordic ski track icon -->
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="30" height="30" rx="8" fill="#e8f3fa"/>
      <!-- Ski tracks -->
      <path d="M6 23 Q10 11 15 16 Q20 21 24 9" stroke="#12355b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M9 23 Q13 13 17 17 Q21 21 25 11" stroke="#6cc0e5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Ground line -->
      <line x1="4" y1="25" x2="26" y2="25" stroke="#12355b" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </svg>
    <div>
      <div class="site-header__title">Nordic Ski Centers</div>
      <div class="site-header__tagline">Cross-country skiing across North America</div>
    </div>
  </a>

  <div class="site-header__search">
    <div class="search-input-wrap">
      <span class="search-input-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M6.5 1a5.5 5.5 0 1 0 3.613 9.677l3.355 3.355a.75.75 0 1 0 1.06-1.061l-3.354-3.354A5.5 5.5 0 0 0 6.5 1zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/>
        </svg>
      </span>
      <input
        type="search"
        id="location-search"
        class="search-input"
        placeholder="Search a town, ZIP, or ski area"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search by location or ski area name"
        aria-autocomplete="list"
        aria-controls="search-listbox"
        aria-expanded="false"
      />
    </div>
  </div>

  <div class="site-header__actions">
    <button class="btn-share" id="btn-share" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.499 2.499 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5z"/>
      </svg>
      Share this search
    </button>
  </div>
</header>

<!-- =========================================================
     Filter bar
     ========================================================= -->
<div class="filter-bar" role="group" aria-label="Filters">
  <button class="chip" id="chip-grooming" type="button" aria-haspopup="true" aria-expanded="false">
    Grooming <span aria-hidden="true">▾</span>
  </button>
  <button class="chip" id="chip-snowmaking" type="button" aria-pressed="false">
    Snowmaking
  </button>
  <button class="chip" id="chip-more" type="button" aria-haspopup="true" aria-expanded="false">
    More filters <span aria-hidden="true">▾</span>
  </button>
</div>

<!-- =========================================================
     Main body
     ========================================================= -->
<div class="main-body">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">

    <!-- Trail length (wired in Step 4) -->
    <div class="trail-length-area">
      <div class="trail-length-header">
        <span class="trail-length-label">Trail length</span>
        <span class="trail-length-readout" id="trail-length-readout">Any length</span>
      </div>
      <div class="trail-length-track" id="trail-length-track"></div>
      <div class="trail-length-axis">
        <span>0 km</span><span>50 km</span><span>100+ km</span>
      </div>
    </div>

    <!-- Results header -->
    <div class="results-header">
      <span class="results-count" id="result-count" aria-live="polite" aria-atomic="true"></span>
      <select class="sort-select" id="sort-select" aria-label="Sort ski areas">
        <option value="name">Name (A–Z)</option>
        <option value="dist" disabled>Nearest first</option>
        <option value="kmDesc">Most trail km</option>
        <option value="kmAsc">Fewest trail km</option>
        <option value="groom">Grooming</option>
        <option value="snow">Snowmaking first</option>
      </select>
    </div>

    <!-- Feature listing -->
    <div id="feature-listing" class="listing" role="list"></div>

  </div>

  <!-- Map -->
  <div id="map"></div>

</div>

<!-- Legacy filter inputs kept in DOM for JS compat (removed in Step 3) -->
<div style="display:none" aria-hidden="true">
  <input id="feature-filter" type="text" />
  <select id="filter-grooming">
    <option value="all">All</option>
    <option value="skate">Skate</option>
    <option value="classic">Classic Only</option>
    <option value="both">Skate &amp; Classic</option>
    <option value="unknown">Unknown</option>
  </select>
  <select id="filter-lit">
    <option value="all">All</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>
  <select id="filter-snow">
    <option value="all">All</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>
  <input id="filter-length-min" type="number" />
  <input id="filter-length-max" type="number" />
</div>

<script>

/* =================================================================
   Map setup
   ================================================================= */
mapboxgl.accessToken = 'pk.eyJ1IjoibW94eXBlZCIsImEiOiJjaWgydGpwdmYweHJydnFtMzZzOXpmNjg3In0.5TXWYv0Z7nsOZHneIQOhxg';

var map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v11',
  center: [-98, 38.88],
  minZoom: 1,
  zoom: 3
});

/* =================================================================
   State
   ================================================================= */
var nordic_centers = [];   // visible + unique features (in map bounds)
var allFeatures    = [];   // complete dataset
var fullGeoJSON    = null;
var sourceIsFiltered = false;
var lastFilterKey    = '';

/* =================================================================
   DOM refs
   ================================================================= */
var listingEl        = document.getElementById('feature-listing');
var filterEl         = document.getElementById('feature-filter');
var filterGroomingEl = document.getElementById('filter-grooming');
var filterLitEl      = document.getElementById('filter-lit');
var filterSnowEl     = document.getElementById('filter-snow');
var filterLengthMinEl = document.getElementById('filter-length-min');
var filterLengthMaxEl = document.getElementById('filter-length-max');
var countEl          = document.getElementById('result-count');

var popup = new mapboxgl.Popup({ closeButton: false });

/* =================================================================
   Helpers
   ================================================================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isValidValue(val) {
  if (val === null || val === undefined) return false;
  var s = String(val).trim().toLowerCase();
  return s !== '' && s !== 'n/a' && s !== 'na' && s !== 'unknown' && s !== 'none';
}

function getLengthKm(prop) {
  // v2 data: km is precomputed
  if (prop.km !== null && prop.km !== undefined) return prop.km;
  // legacy fallback
  if (!isValidValue(prop.Length)) return null;
  var len = parseFloat(prop.Length);
  if (isNaN(len)) return null;
  var u = (prop.Units || '').trim().toLowerCase();
  if (u === 'mi' || u === 'm') return Math.round(len * 1.60934 * 10) / 10;
  if (u === 'km') return len;
  return null;
}

function normalizeGrooming(val) {
  if (!isValidValue(val)) return 'unknown';
  var v = val.trim().toLowerCase();
  if (v === 'unknown' || v === 'yes') return 'unknown';
  if ((v.indexOf('skate') > -1 && v.indexOf('classic') > -1) || v === 'skating/classical') return 'both';
  if (v.indexOf('skate') > -1 || v.indexOf('skating') > -1) return 'skate';
  if (v.indexOf('classic') > -1) return 'classic';
  return 'unknown';
}

/* =================================================================
   Filtering
   ================================================================= */
function hasActiveFilters() {
  return filterEl.value.trim() !== ''
    || filterGroomingEl.value !== 'all'
    || filterLitEl.value !== 'all'
    || filterSnowEl.value !== 'all'
    || filterLengthMinEl.value !== ''
    || filterLengthMaxEl.value !== '';
}

function featureMatchesFilters(feature, nameValue, groomValue, litValue, snowValue, minLen, maxLen) {
  var prop = feature.properties;
  var name = prop.Name || '';
  if (nameValue && name.toLowerCase().indexOf(nameValue) === -1) return false;

  if (groomValue !== 'all') {
    var ng = prop.groomType || normalizeGrooming(prop.Groomed);
    if (groomValue === 'both'    && ng !== 'both')                        return false;
    if (groomValue === 'skate'   && ng !== 'skate'   && ng !== 'both')    return false;
    if (groomValue === 'classic' && ng !== 'classic' && ng !== 'both')    return false;
    if (groomValue === 'unknown' && ng !== 'unknown')                      return false;
  }

  if (litValue  !== 'all' && prop.Lit        !== litValue)  return false;
  if (snowValue !== 'all' && prop.Snowmaking  !== snowValue) return false;

  if (minLen !== null || maxLen !== null) {
    var km = getLengthKm(prop);
    if (km === null) return false;
    if (minLen !== null && km < minLen) return false;
    if (maxLen !== null && km > maxLen) return false;
  }
  return true;
}

function applyFilters() {
  var nameValue  = filterEl.value.trim().toLowerCase();
  var groomValue = filterGroomingEl.value;
  var litValue   = filterLitEl.value;
  var snowValue  = filterSnowEl.value;
  var minLen = filterLengthMinEl.value !== '' ? parseFloat(filterLengthMinEl.value) : null;
  var maxLen = filterLengthMaxEl.value !== '' ? parseFloat(filterLengthMaxEl.value) : null;

  var filtered = nordic_centers.filter(function (f) {
    return featureMatchesFilters(f, nameValue, groomValue, litValue, snowValue, minLen, maxLen);
  });

  renderListings(filtered);

  // Update map source so clusters reflect active filters
  var filterKey    = [nameValue, groomValue, litValue, snowValue, minLen, maxLen].join('|');
  var filtersActive = hasActiveFilters();

  if (filtersActive && fullGeoJSON && filterKey !== lastFilterKey) {
    var allFiltered = allFeatures.filter(function (f) {
      return featureMatchesFilters(f, nameValue, groomValue, litValue, snowValue, minLen, maxLen);
    });
    map.getSource('nordic-ski-areas').setData({ type: 'FeatureCollection', features: allFiltered });
    sourceIsFiltered = true;
    lastFilterKey    = filterKey;
  } else if (!filtersActive && sourceIsFiltered && fullGeoJSON) {
    map.getSource('nordic-ski-areas').setData(fullGeoJSON);
    sourceIsFiltered = false;
    lastFilterKey    = '';
  }

  map.setFilter('unclustered-point',         ['!', ['has', 'point_count']]);
  map.setFilter('unclustered-point-hitarea', ['!', ['has', 'point_count']]);
  map.setFilter('unclustered-point-label',   ['!', ['has', 'point_count']]);
}

/* =================================================================
   Listing render (cards redesigned in Step 3)
   ================================================================= */
function renderListings(features) {
  listingEl.innerHTML = '';

  if (features.length === 0) {
    var msg = document.createElement('p');
    msg.className = 'listing-empty';
    msg.textContent = hasActiveFilters()
      ? 'No ski areas here match your filters'
      : 'Pan and zoom the map to explore ski areas';
    listingEl.appendChild(msg);
    countEl.textContent = hasActiveFilters() ? 'No results' : '';
    return;
  }

  countEl.textContent = features.length + ' ski area' + (features.length !== 1 ? 's' : '');

  features.forEach(function (feature) {
    var prop = feature.properties;
    var groomLabel = prop.groomType === 'both'    ? 'Skate + classic'
                   : prop.groomType === 'classic' ? 'Classic only'
                   : prop.groomType === 'skate'   ? 'Skate only'
                   : '';

    var btn = document.createElement('button');
    btn.className = 'listing-item';
    btn.setAttribute('role', 'listitem');
    btn.setAttribute('type', 'button');

    var nameEl = document.createElement('div');
    nameEl.style.cssText = 'font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px;';
    nameEl.textContent = prop.Name;

    var metaEl = document.createElement('div');
    metaEl.style.cssText = 'font-size:13px;color:var(--muted);';
    metaEl.textContent = (prop.region || '') + (groomLabel ? (prop.region ? ' · ' : '') + groomLabel : '');

    btn.appendChild(nameEl);
    btn.appendChild(metaEl);

    btn.addEventListener('mouseover', function () {
      popup.setLngLat(feature.geometry.coordinates).setText(prop.Name).addTo(map);
    });
    btn.addEventListener('mouseout', function () { popup.remove(); });

    btn.addEventListener('click', function () {
      listingEl.querySelectorAll('.listing-item').forEach(function (el) { el.classList.remove('is-active'); });
      btn.classList.add('is-active');
      map.flyTo({ center: feature.geometry.coordinates, zoom: 12 });
      // Temporary popup (replaced by detail panel in Step 7)
      var html = '<strong>' + escapeHtml(prop.Name) + '</strong>';
      if (prop.region) html += '<div style="font-size:13px;color:#4d5d6c;margin-top:2px">' + escapeHtml(prop.region) + '</div>';
      if (isValidValue(prop.Notes)) html += '<div style="font-size:13px;margin-top:6px">' + escapeHtml(prop.Notes).substring(0, 160) + '</div>';
      new mapboxgl.Popup({ maxWidth: '300px' })
        .setLngLat(feature.geometry.coordinates)
        .setHTML(html)
        .addTo(map);
    });

    listingEl.appendChild(btn);
  });
}

/* =================================================================
   Visible-features update
   ================================================================= */
function getUniqueFeatures(array, key) {
  var seen = {};
  return array.filter(function (f) {
    var k = f.properties[key];
    if (seen[k]) return false;
    seen[k] = true;
    return true;
  });
}

function updateVisibleFeatures() {
  if (allFeatures.length === 0) return;
  var bounds = map.getBounds();
  var visible = allFeatures.filter(function (f) {
    var c = f.geometry.coordinates;
    return bounds.contains([c[0], c[1]]);
  });
  nordic_centers = getUniqueFeatures(visible, 'id');
  filterEl.value = '';
  applyFilters();
}

/* =================================================================
   Filter event listeners (kept for compat; replaced in Steps 3 & 4)
   ================================================================= */
filterEl.addEventListener('input',               function () { applyFilters(); });
filterGroomingEl.addEventListener('change',      function () { applyFilters(); });
filterLitEl.addEventListener('change',           function () { applyFilters(); });
filterSnowEl.addEventListener('change',          function () { applyFilters(); });
filterLengthMinEl.addEventListener('input',      function () { applyFilters(); });
filterLengthMaxEl.addEventListener('input',      function () { applyFilters(); });

listingEl.addEventListener('scroll', function () {
  listingEl.classList.toggle('scrolled', listingEl.scrollTop > 0);
});

/* =================================================================
   Map load
   ================================================================= */
map.on('load', function () {

  map.addSource('nordic-ski-areas', {
    type: 'geojson',
    data: 'data/nordic-ski-areas-v2.geojson',
    cluster: true,
    clusterMaxZoom: 10,
    clusterRadius: 40,
    clusterMinPoints: 6,
    promoteId: 'id'
  });

  fetch('data/nordic-ski-areas-v2.geojson')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      fullGeoJSON  = data;
      allFeatures  = data.features;
      updateVisibleFeatures();
    });

  /* Clusters ---------------------------------------------------- */
  map.addLayer({
    id: 'clusters',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['has', 'point_count'],
    paint: {
      'circle-color': [
        'step', ['get', 'point_count'],
        '#f4a460', 100, '#e8723a', 750, '#c94a2a'
      ],
      'circle-radius': [
        'step', ['get', 'point_count'],
        20, 100, 30, 750, 40
      ]
    }
  });

  map.addLayer({
    id: 'cluster-count',
    type: 'symbol',
    source: 'nordic-ski-areas',
    filter: ['has', 'point_count'],
    layout: {
      'text-field': '{point_count_abbreviated}',
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': 12
    }
  });

  /* Individual pins (restyled in Step 5) ------------------------- */
  map.addLayer({
    id: 'unclustered-point',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': '#e85d26',
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        3, 6, 8, 8, 12, 10, 16, 14
      ],
      'circle-stroke-width': [
        'interpolate', ['linear'], ['zoom'],
        3, 2, 8, 2.5, 12, 3
      ],
      'circle-stroke-color': '#fff'
    }
  });

  map.addLayer({
    id: 'unclustered-point-hitarea',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': 'rgba(0,0,0,0)',
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        3, 12, 8, 16, 12, 22, 16, 22
      ],
      'circle-stroke-width': 0,
      'circle-stroke-color': 'rgba(0,0,0,0)'
    }
  });

  map.addLayer({
    id: 'unclustered-point-label',
    type: 'symbol',
    source: 'nordic-ski-areas',
    filter: ['!', ['has', 'point_count']],
    minzoom: 5,
    layout: {
      'text-field': ['get', 'Name'],
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': [
        'interpolate', ['linear'], ['zoom'],
        5, 9, 8, 10, 12, 13
      ],
      'text-offset': [0, 1.5],
      'text-anchor': 'top',
      'text-allow-overlap': false,
      'text-optional': true
    },
    paint: {
      'text-color': '#333',
      'text-halo-color': '#fff',
      'text-halo-width': 1.5
    }
  });

  /* Map interactions -------------------------------------------- */
  map.on('click', 'clusters', function (e) {
    var features  = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
    var clusterId = features[0].properties.cluster_id;
    map.getSource('nordic-ski-areas').getClusterExpansionZoom(clusterId, function (err, zoom) {
      if (err) return;
      map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
    });
  });

  map.on('click', 'unclustered-point-hitarea', function (e) {
    var prop = e.features[0].properties;
    var html = '<strong>' + escapeHtml(prop.Name || '') + '</strong>';
    if (prop.region) html += '<div style="font-size:13px;color:#4d5d6c;margin-top:2px">' + escapeHtml(prop.region) + '</div>';
    if (isValidValue(prop.Notes)) html += '<div style="font-size:13px;margin-top:6px">' + escapeHtml(prop.Notes).substring(0, 160) + '</div>';
    new mapboxgl.Popup({ maxWidth: '300px' })
      .setLngLat(e.features[0].geometry.coordinates)
      .setHTML(html)
      .addTo(map);
  });

  map.on('mouseenter', 'clusters',                function () { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'clusters',                function () { map.getCanvas().style.cursor = ''; });
  map.on('mouseenter', 'unclustered-point-hitarea', function (e) {
    map.getCanvas().style.cursor = 'pointer';
    if (e.features.length) {
      popup.setLngLat(e.features[0].geometry.coordinates.slice())
           .setText(e.features[0].properties.Name)
           .addTo(map);
    }
  });
  map.on('mouseleave', 'unclustered-point-hitarea', function () {
    map.getCanvas().style.cursor = '';
    popup.remove();
  });

  map.on('moveend', function () { updateVisibleFeatures(); });

  renderListings([]);
});

</script>
</body>
</html>
