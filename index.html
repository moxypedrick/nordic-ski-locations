/* =========================================================
   Step 11 — Snow data fetch + filter
   ========================================================= */
function snowInchesForWindow(entry, hours) {
  if (hours === 6)  return entry.snowfall6h  || 0;
  if (hours === 12) return entry.snowfall12h || 0;
  if (hours === 48) return entry.snowfall48h || 0;
  return entry.snowfall24h || 0;
}

function updateSnowBadge(id) {
  var el = document.getElementById('snow-badge-' + id);
  if (!el) return;
  var cached = snowCache[id];
  if (!cached || cached.error) { el.textContent = '❄ ?'; return; }
  var inches = snowInchesForWindow(cached, state.snowWindow);
  if (inches > 0) {
    el.textContent = '❄ ' + inches.toFixed(1) + '"';
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

function fetchSnowData(feature, callback) {
  var id    = feature.properties.id;
  var coords = feature.geometry.coordinates;
  var lat   = coords[1];
  var lon   = coords[0];

  var cached = snowCache[id];
  if (cached && !cached.error && Date.now() - cached.fetchedAt < 30 * 60 * 1000) {
    callback(null, cached);
    return;
  }

  var url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + lat.toFixed(4)
    + '&longitude=' + lon.toFixed(4)
    + '&hourly=snowfall,snow_depth'
    + '&past_days=2&forecast_days=0&timezone=auto';

  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var sf = data.hourly.snowfall;    // cm/hr
      var sd = data.hourly.snow_depth;  // meters

      function sumLast(arr, n) {
        var slice = arr.slice(Math.max(0, arr.length - n));
        return slice.reduce(function (a, b) { return a + (b || 0); }, 0);
      }
      function lastNonNull(arr) {
        for (var i = arr.length - 1; i >= 0; i--) {
          if (arr[i] !== null) return arr[i];
        }
        return 0;
      }

      var entry = {
        fetchedAt:   Date.now(),
        snowfall6h:  sumLast(sf, 6)  / 2.54,
        snowfall12h: sumLast(sf, 12) / 2.54,
        snowfall24h: sumLast(sf, 24) / 2.54,
        snowfall48h: sumLast(sf, 48) / 2.54,
        depthIn:     lastNonNull(sd) * 39.37
      };
      snowCache[id] = entry;
      callback(null, entry);
    })
    .catch(function (err) {
      snowCache[id] = { fetchedAt: Date.now(), error: true };
      callback(err, null);
    });
}

function loadSnowForVisible(features) {
  var toFetch = features.filter(function (f) {
    var c = snowCache[f.properties.id];
    return !c || c.error || (Date.now() - c.fetchedAt > 30 * 60 * 1000);
  });
  var BATCH = 10;
  var idx = 0;

  function next() {
    if (idx >= toFetch.length) {
      if (state.mapColorMode === 'snow') updatePinColors();
      return;
    }
    var batch = toFetch.slice(idx, idx + BATCH);
    idx += BATCH;
    var pending = batch.length;
    batch.forEach(function (f) {
      fetchSnowData(f, function () {
        updateSnowBadge(f.properties.id);
        pending--;
        if (pending === 0) next();
      });
    });
  }
  next();
}

/* Snow filter chip + popover */
(function () {
  var chipSnowFilterEl = document.getElementById('chip-snow-filter');
  var popoverSnowEl    = document.getElementById('popover-snow');
  var btnShowSnowEl    = document.getElementById('btn-show-snow');
  var snowMinSliderEl  = document.getElementById('snow-min-slider');
  var snowMinReadoutEl = document.getElementById('snow-min-readout');

  if (!chipSnowFilterEl || !popoverSnowEl) return;

  function openSnowPopover() {
    popoverSnowEl.classList.add('is-open');
    chipSnowFilterEl.setAttribute('aria-expanded', 'true');
  }
  function closeSnowPopover() {
    popoverSnowEl.classList.remove('is-open');
    chipSnowFilterEl.setAttribute('aria-expanded', 'false');
  }

  chipSnowFilterEl.addEventListener('click', function (e) {
    e.stopPropagation();
    if (popoverSnowEl.classList.contains('is-open')) {
      closeSnowPopover();
    } else {
      closeSnowPopover();
      openSnowPopover();
    }
  });

  if (btnShowSnowEl) {
    btnShowSnowEl.addEventListener('click', function () {
      closeSnowPopover();
      applyFilters();
    });
  }

  /* Time window buttons */
  var winBtns = popoverSnowEl.querySelectorAll('.snow-win-btn');
  winBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.snowWindow = parseInt(btn.getAttribute('data-hours'), 10);
      winBtns.forEach(function (b) {
        b.classList.toggle('is-active', b.getAttribute('data-hours') === btn.getAttribute('data-hours'));
      });
      var feats = state.sync ? visibleFeatures : allFeatures;
      feats.forEach(function (f) { updateSnowBadge(f.properties.id); });
      if (state.filters.snowMinIn > 0) applyFilters();
    });
  });

  /* Min-snow slider */
  if (snowMinSliderEl) {
    snowMinSliderEl.addEventListener('input', function () {
      state.filters.snowMinIn = parseFloat(snowMinSliderEl.value);
      if (snowMinReadoutEl) snowMinReadoutEl.textContent = state.filters.snowMinIn.toFixed(1) + '"';
    });
    snowMinSliderEl.addEventListener('change', function () {
      applyFilters();
    });
  }

  /* Close on outside click */
  document.addEventListener('mousedown', function (e) {
    if (!popoverSnowEl.classList.contains('is-open')) return;
    if (chipSnowFilterEl.contains(e.target) || popoverSnowEl.contains(e.target)) return;
    closeSnowPopover();
  });
}());

/* =========================================================
   Step 12 — Snow map color mode
   ========================================================= */
var SNOW_COLORS = {
  none:     '#9aa4ad',
  trace:    '#b8d4e8',
  light:    '#6db3e0',
  moderate: '#2b87c8',
  heavy:    '#ffffff'
};

var GROOM_COLOR_EXPR = [
  'match', ['get', 'groomType'],
  'both',    '#1b4f8a',
  'skate',   '#e07b24',
  'classic', '#6cc0e5',
  '#9aa4ad'
];

function updatePinColors() {
  if (!dataLoaded || !map.getLayer('unclustered-point')) return;

  if (state.mapColorMode === 'groom') {
    map.setPaintProperty('unclustered-point', 'circle-color', GROOM_COLOR_EXPR);
    document.getElementById('legend-groom').style.display = '';
    document.getElementById('legend-snow').style.display = 'none';
  } else {
    var matchExpr = ['match', ['get', 'id']];
    allFeatures.forEach(function (f) {
      var id = f.properties.id;
      var cached = snowCache[id];
      var color = SNOW_COLORS.none;
      if (cached && !cached.error) {
        var inches = snowInchesForWindow(cached, state.snowWindow);
        if (inches >= 4)   color = SNOW_COLORS.heavy;
        else if (inches >= 2)   color = SNOW_COLORS.moderate;
        else if (inches >= 0.5) color = SNOW_COLORS.light;
        else if (inches > 0)    color = SNOW_COLORS.trace;
      }
      matchExpr.push(id, color);
    });
    matchExpr.push(SNOW_COLORS.none);
    map.setPaintProperty('unclustered-point', 'circle-color', matchExpr);
    document.getElementById('legend-groom').style.display = 'none';
    document.getElementById('legend-snow').style.display = '';
  }
}

(function () {
  var btn = document.getElementById('btn-color-mode');
  if (!btn) return;
  btn.addEventListener('click', function () {
    state.mapColorMode = state.mapColorMode === 'groom' ? 'snow' : 'groom';
    btn.classList.toggle('is-active', state.mapColorMode === 'snow');
    btn.setAttribute('aria-pressed', state.mapColorMode === 'snow' ? 'true' : 'false');
    btn.title = state.mapColorMode === 'snow' ? 'Color pins by grooming type' : 'Color pins by recent snow';
    btn.setAttribute('aria-label', btn.title);
    updatePinColors();
  });
}());

   Step 13 — Trail lines
   ========================================================= */
var trailsVisible = false;

function updateTrailsButton() {
  var btn = document.getElementById('btn-trails');
  if (!btn) return;
  var zoom = map.getZoom();
  if (zoom < 10) {
    btn.disabled = true;
    btn.title = 'Zoom in to see trails';
    btn.setAttribute('aria-label', 'Show ski trails (zoom in to enable)');
  } else {
    btn.disabled = false;
    btn.title = trailsVisible ? 'Hide ski trails' : 'Show ski trails';
    btn.setAttribute('aria-label', btn.title);
  }
}

(function () {
  var btn = document.getElementById('btn-trails');
  var legendTrails = document.getElementById('legend-trails');
  if (!btn) return;
  btn.addEventListener('click', function () {
    trailsVisible = !trailsVisible;
    var vis = trailsVisible ? 'visible' : 'none';
    if (map.getLayer('ski-trails-casing')) map.setLayoutProperty('ski-trails-casing', 'visibility', vis);
    if (map.getLayer('ski-trails'))        map.setLayoutProperty('ski-trails',        'visibility', vis);
    btn.classList.toggle('is-active', trailsVisible);
    btn.setAttribute('aria-pressed', trailsVisible ? 'true' : 'false');
    if (legendTrails) legendTrails.style.display = trailsVisible ? '' : 'none';
    updateTrailsButton();
  });
}());
