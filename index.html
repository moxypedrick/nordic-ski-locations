<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nordic Ski Centers</title>
<meta name="viewport" content="initial-scale=1,width=device-width" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.css" rel="stylesheet" />
<script data-goatcounter="https://nordic-centers.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>

/* =========================================================
   Design tokens
   ========================================================= */
:root {
  --navy:        #12355b;
  --ink:         #12212f;
  --muted:       #4d5d6c;
  --link:        #1d5f9e;
  --ice:         #e8f3fa;
  --line:        #e3e8ed;
  --chip:        #f1f4f7;
  --warm-bg:     #fdf0e3;
  --warm-fg:     #7a3d06;
  --water:       #cfe6f3;

  --radius-pill:  20px;
  --radius-panel: 12px;
  --radius-input: 8px;

  --shadow-popover: 0 10px 30px rgba(18,33,47,.16);
  --shadow-control: 0 2px 8px rgba(18,33,47,.18);
}

/* =========================================================
   Reset & base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================================================
   Header
   ========================================================= */
.site-header {
  height: 68px;
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 10;
}

.site-header__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  text-decoration: none;
  color: inherit;
}

.site-header__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.2;
}

.site-header__tagline {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.2;
}

.site-header__search {
  flex: 1;
  max-width: 620px;
  margin: 0 auto;
  position: relative;
}

.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  display: flex;
}

.search-input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 36px 0 38px;
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  appearance: none;
}

.search-input:focus {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
  border-color: var(--navy);
}

.search-input::placeholder { color: var(--muted); }
.search-input-wrap--has-value .search-input { padding-right: 72px; }
.search-input { padding-right: 40px; } /* room for geolocate button */

.search-clear-btn,
.search-geo-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  padding: 0;
  border-radius: 4px;
}
.search-clear-btn:hover,
.search-geo-btn:hover { color: var(--ink); }
.search-clear-btn:focus-visible,
.search-geo-btn:focus-visible { outline: 2px solid #6cc0e5; outline-offset: 1px; }
.search-geo-btn { right: 8px; width: 28px; height: 28px; }
.search-clear-btn { right: 38px; width: 24px; height: 24px; }
.search-geo-btn.is-loading svg { animation: geo-spin 0.8s linear infinite; }
@keyframes geo-spin { to { transform: rotate(360deg); } }

.search-listbox {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-popover);
  z-index: 200;
  max-height: 280px;
  overflow-y: auto;
}
.search-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  color: var(--ink);
}
.search-option:hover,
.search-option.is-active { background: var(--ice); }
.search-option__icon { flex-shrink: 0; font-size: 13px; line-height: 1; }
.search-option__label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.user-location-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #2f80ed;
  border: 2px solid #fff;
  box-shadow: 0 0 0 4px rgba(47,128,237,0.25), 0 2px 6px rgba(0,0,0,0.2);
}

.site-header__actions { flex-shrink: 0; }

.btn-share {
  height: 36px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-share:hover { background: var(--chip); }

/* =========================================================
   Filter bar
   ========================================================= */
.filter-bar {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chip {
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}

.chip:hover { background: var(--chip); }

.chip[aria-pressed="true"],
.chip.is-active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

/* =========================================================
   Main body
   ========================================================= */
.main-body {
  display: flex;
  flex-wrap: wrap;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* =========================================================
   Sidebar
   ========================================================= */
.sidebar {
  flex: 1 1 380px;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: #fff;
  overflow: hidden;
  min-height: 0;
}

/* Trail length area (wired in Step 4) */
.trail-length-area {
  flex-shrink: 0;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}

.trail-length-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.trail-length-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.trail-length-readout {
  font-size: 14px;
  color: var(--muted);
}

.trail-length-track {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  margin-bottom: 6px;
}

.trail-length-axis {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* Results header */
.results-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  gap: 8px;
  min-height: 44px;
}

.results-count {
  font-size: 14px;
  color: var(--muted);
  flex: 1;
  min-width: 0;
}

.sort-select {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  padding: 0 8px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
  flex-shrink: 0;
}

.sort-select:focus {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
}

/* Feature listing */
.listing {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.listing.scrolled {
  box-shadow: inset 0 6px 6px -6px rgba(0,0,0,.1);
}

/* =========================================================
   Detail panel
   ========================================================= */
.detail-panel {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding: 0 16px 32px;
}
.detail-panel__back {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  padding: 14px 0 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--link);
  cursor: pointer;
  margin: 0 -4px;
  border-radius: 4px;
}
.detail-panel__back:hover { color: var(--navy); }
.detail-panel__back:focus-visible { outline: 3px solid #6cc0e5; outline-offset: 1px; }
.detail-panel__header { margin-bottom: 14px; }
.detail-panel__name {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  margin: 0 0 4px;
  line-height: 1.2;
}
.detail-panel__region {
  font-size: 14px;
  color: var(--muted);
}
.detail-panel__actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.btn-directions,
.btn-website {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 18px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.btn-directions {
  background: var(--navy);
  color: #fff;
  border: none;
}
.btn-directions:hover { background: #0e284a; }
.btn-website {
  background: #fff;
  color: var(--navy);
  border: 1px solid var(--line);
}
.btn-website:hover { border-color: var(--navy); background: var(--ice); }
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
  margin-bottom: 20px;
}
.detail-grid__item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.detail-grid__label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.detail-grid__value {
  font-size: 15px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-grid__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
}
.detail-notes {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

/* =========================================================
   Cards
   ========================================================= */
.card {
  display: block;
  width: 100%;
  padding: 10px 16px 11px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: #fff;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
}

.card:hover { background: var(--chip); }

.card.is-active {
  background: var(--ice);
  box-shadow: inset 3px 0 0 var(--navy);
}

.card__top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 1px;
}

.card__name {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card__distance {
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}

.card__region {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.card__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

/* Base tag */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  background: var(--chip);
  color: var(--ink);
}

/* Grooming tag */
.tag--groom { background: var(--chip); }

.tag__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* km tag */
.tag--km { background: var(--chip); color: var(--muted); font-weight: 400; }

/* Snowmaking tag */
.tag--snow { background: var(--ice); color: var(--navy); }

/* Lit at night tag */
.tag--lit { background: var(--warm-bg); color: var(--warm-fg); }

/* =========================================================
   Results header subtitle
   ========================================================= */
.results-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}

/* =========================================================
   Empty / more state
   ========================================================= */
.listing-empty {
  padding: 32px 16px;
  text-align: center;
  font-size: 15px;
  color: var(--muted);
  line-height: 1.5;
}

.listing-more {
  padding: 12px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
}

.btn-clear-filters {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fff;
  color: var(--navy);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-clear-filters:hover { background: var(--chip); }

/* =========================================================
   Skeleton loading cards
   ========================================================= */
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

.skeleton {
  display: block;
  padding: 10px 16px 11px;
  border-bottom: 1px solid var(--line);
}

.skeleton__line {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, #e8ecef 25%, #f4f6f7 50%, #e8ecef 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s infinite linear;
  margin-bottom: 8px;
}

.skeleton__line--name  { width: 65%; height: 14px; margin-bottom: 6px; }
.skeleton__line--region{ width: 40%; margin-bottom: 8px; }
.skeleton__line--tags  { width: 80%; height: 20px; border-radius: var(--radius-pill); }

/* =========================================================
   Map
   ========================================================= */
#map {
  flex: 999 1 560px;
  min-width: 0;
  position: relative;
}

/* =========================================================
   Mapbox overrides
   ========================================================= */
.mapboxgl-popup-content {
  padding: 12px 16px;
  font-size: 14px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  border-top: 3px solid var(--navy);
  border-radius: 0 0 var(--radius-input) var(--radius-input);
}

.mapboxgl-popup-close-button {
  font-size: 20px;
  padding: 4px 8px;
  color: var(--muted);
}

/* =========================================================
   Filter chip wraps + popovers
   ========================================================= */
.chip-wrap {
  position: relative;
}

.popover {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 220px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-popover);
  z-index: 100;
  display: none;
}

.popover.is-open { display: block; }

.popover__body { padding: 12px 16px 4px; }

.popover__footer {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
}

.popover-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}

.popover-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--navy);
  cursor: pointer;
  flex-shrink: 0;
  margin: 0;
}

.btn-show-areas {
  width: 100%;
  height: 34px;
  border: none;
  border-radius: var(--radius-pill);
  background: var(--navy);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-show-areas:hover { background: #0d2845; }

.chip--clear {
  background: var(--chip);
  border-color: var(--chip);
  color: var(--ink);
  font-weight: 400;
}

.chip--clear:hover { background: var(--line); border-color: var(--line); }

/* =========================================================
   Trail length histogram + dual-range slider
   ========================================================= */
.tl-wrap { margin-bottom: 4px; }

.tl-histogram {
  display: flex;
  align-items: flex-end;
  height: 44px;
  gap: 2px;
  margin-bottom: 4px;
}

.tl-bar {
  flex: 1;
  min-height: 0;
  border-radius: 2px 2px 0 0;
  background: #e4e8ec;
  transition: background 0.15s;
}

.tl-track-outer {
  position: relative;
  height: 20px;
}

.tl-track-bg {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  pointer-events: none;
}

.tl-fill {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 6px;
  background: var(--navy);
  border-radius: 3px;
  pointer-events: none;
  left: 0;
  right: 0;
}

.tl-range {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0; left: 0;
  margin: 0; padding: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  pointer-events: none;
}

.tl-range::-webkit-slider-runnable-track { background: transparent; height: 6px; }
.tl-range::-moz-range-track { background: transparent; height: 6px; }

.tl-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--navy);
  pointer-events: auto;
  cursor: grab;
  margin-top: -6px;
  box-shadow: 0 1px 4px rgba(18,33,47,.2);
}

.tl-range::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--navy);
  pointer-events: auto;
  cursor: grab;
  box-shadow: 0 1px 4px rgba(18,33,47,.2);
}

.tl-range:focus { outline: none; }

.tl-range:focus-visible::-webkit-slider-thumb {
  outline: 3px solid #6cc0e5;
  outline-offset: 2px;
}

.tl-range--top { z-index: 2; }

/* =========================================================
   Map overlays: sync switch, nav controls, legend
   ========================================================= */
#map { position: relative; }

.sync-switch-wrap {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  background: #fff;
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  box-shadow: var(--shadow-control);
  white-space: nowrap;
}

.sync-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  user-select: none;
}

.sync-label input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--navy);
  cursor: pointer;
  margin: 0;
}

.nav-controls {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-btn {
  width: 44px;
  height: 44px;
  background: #fff;
  border: none;
  border-radius: 6px;
  box-shadow: var(--shadow-control);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  cursor: pointer;
}

.nav-btn:hover { background: var(--chip); }

.nav-btn:focus-visible {
  outline: 3px solid #6cc0e5;
  outline-offset: -1px;
}

.map-legend {
  position: absolute;
  bottom: 30px;
  left: 10px;
  z-index: 10;
  background: #fff;
  border-radius: var(--radius-panel);
  padding: 10px 12px;
  box-shadow: var(--shadow-control);
  font-size: 13px;
}

.map-legend__item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
}

.map-legend__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
}

/* Pin hover → card highlight */
.card.is-pin-hover {
  background: var(--ice);
  box-shadow: inset 3px 0 0 var(--navy);
}

/* =========================================================
   Narrow viewports: map wraps below sidebar
   ========================================================= */
@media (max-width: 940px) {
  body { overflow: auto; }
  .main-body { overflow: visible; }
  #map { min-height: 60vw; }
}

</style>
</head>
<body>

<!-- =========================================================
     Header
     ========================================================= -->
<header class="site-header">
  <a class="site-header__brand" href="/" aria-label="Nordic Ski Centers home">
    <!-- Logo mark: nordic ski track icon -->
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="30" height="30" rx="8" fill="#e8f3fa"/>
      <!-- Ski tracks -->
      <path d="M6 23 Q10 11 15 16 Q20 21 24 9" stroke="#12355b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M9 23 Q13 13 17 17 Q21 21 25 11" stroke="#6cc0e5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Ground line -->
      <line x1="4" y1="25" x2="26" y2="25" stroke="#12355b" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </svg>
    <div>
      <div class="site-header__title">Nordic Ski Centers</div>
      <div class="site-header__tagline">Cross-country skiing across North America</div>
    </div>
  </a>

  <div class="site-header__search">
    <div class="search-input-wrap">
      <span class="search-input-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M6.5 1a5.5 5.5 0 1 0 3.613 9.677l3.355 3.355a.75.75 0 1 0 1.06-1.061l-3.354-3.354A5.5 5.5 0 0 0 6.5 1zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/>
        </svg>
      </span>
      <input
        type="search"
        id="location-search"
        class="search-input"
        placeholder="Search a town, ZIP, or ski area"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search by location or ski area name"
        aria-autocomplete="list"
        aria-controls="search-listbox"
        aria-expanded="false"
      />
      <button class="search-clear-btn" id="search-clear" type="button" aria-label="Clear search" style="display:none">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
          <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="search-geo-btn" id="btn-geolocate" type="button" aria-label="Use my current location">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 2a5 5 0 1 1 0 10A5 5 0 0 1 8 3zm0 2a3 3 0 1 0 0 6A3 3 0 0 0 8 5zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        </svg>
      </button>
      <div id="search-listbox" class="search-listbox" role="listbox" aria-label="Search suggestions" style="display:none"></div>
    </div>
  </div>

  <div class="site-header__actions">
    <button class="btn-share" id="btn-share" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.499 2.499 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5z"/>
      </svg>
      Share this search
    </button>
  </div>
</header>

<!-- =========================================================
     Filter bar
     ========================================================= -->
<div class="filter-bar" role="group" aria-label="Filters">

  <!-- Grooming popover -->
  <div class="chip-wrap">
    <button class="chip" id="chip-grooming" type="button" aria-haspopup="true" aria-expanded="false">
      <span id="chip-grooming-label">Grooming</span> <span aria-hidden="true">▾</span>
    </button>
    <div class="popover" id="popover-grooming" role="dialog" aria-label="Grooming filter">
      <div class="popover__body">
        <label class="popover-label">
          <input type="checkbox" id="filter-skate"> Groomed for skate
        </label>
        <label class="popover-label">
          <input type="checkbox" id="filter-classic"> Groomed for classic
        </label>
      </div>
      <div class="popover__footer">
        <button class="btn-show-areas" id="btn-show-grooming" type="button">Show areas</button>
      </div>
    </div>
  </div>

  <!-- Snowmaking toggle -->
  <button class="chip" id="chip-snowmaking" type="button" aria-pressed="false">
    Snowmaking
  </button>

  <!-- More filters popover -->
  <div class="chip-wrap">
    <button class="chip" id="chip-more" type="button" aria-haspopup="true" aria-expanded="false">
      <span id="chip-more-label">More filters</span> <span aria-hidden="true">▾</span>
    </button>
    <div class="popover" id="popover-more" role="dialog" aria-label="More filters">
      <div class="popover__body">
        <label class="popover-label">
          <input type="checkbox" id="filter-lit"> Lit at night
        </label>
      </div>
      <div class="popover__footer">
        <button class="btn-show-areas" id="btn-show-more" type="button">Show areas</button>
      </div>
    </div>
  </div>

  <!-- Clear all -->
  <button class="chip chip--clear" id="chip-clear" type="button" style="display:none" aria-label="Clear all filters">
    Clear all
  </button>

</div>

<!-- =========================================================
     Main body
     ========================================================= -->
<div class="main-body">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">

    <!-- Trail length slider + histogram -->
    <div class="trail-length-area">
      <div class="trail-length-header">
        <span class="trail-length-label">Trail length</span>
        <span class="trail-length-readout" id="trail-length-readout">Any length</span>
      </div>
      <div class="tl-wrap">
        <div class="tl-histogram" id="tl-histogram" aria-hidden="true"></div>
        <div class="tl-track-outer">
          <div class="tl-track-bg"></div>
          <div class="tl-fill" id="tl-fill"></div>
          <input type="range" id="tl-min" class="tl-range" min="0" max="100" step="5" value="0"
                 aria-label="Minimum trail length, km">
          <input type="range" id="tl-max" class="tl-range" min="0" max="100" step="5" value="100"
                 aria-label="Maximum trail length, km">
        </div>
      </div>
      <div class="trail-length-axis">
        <span>0 km</span><span>50 km</span><span>100+ km</span>
      </div>
    </div>

    <!-- Results header -->
    <div class="results-header">
      <div style="flex:1;min-width:0;">
        <div class="results-count" id="result-count" aria-live="polite" aria-atomic="true"></div>
        <div class="results-subtitle" id="result-subtitle"></div>
      </div>
      <select class="sort-select" id="sort-select" aria-label="Sort ski areas">
        <option value="name">Name (A–Z)</option>
        <option value="dist" disabled id="sort-opt-dist">Nearest first</option>
        <option value="kmDesc">Most trail km</option>
        <option value="kmAsc">Fewest trail km</option>
        <option value="groom">Grooming</option>
        <option value="snow">Snowmaking first</option>
      </select>
    </div>

    <!-- Feature listing -->
    <div id="feature-listing" class="listing" role="list"></div>

    <!-- Detail panel (Step 7) -->
    <div id="detail-panel" class="detail-panel" style="display:none" role="region" aria-label="Area details">

      <button class="detail-panel__back" id="detail-back" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M10.354 3.646a.5.5 0 0 1 0 .708L6.707 8l3.647 3.646a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 0 1 .708 0z"/>
        </svg>
        Back to results
      </button>

      <div class="detail-panel__header">
        <h2 class="detail-panel__name" id="dp-name"></h2>
        <div class="detail-panel__region" id="dp-region"></div>
      </div>

      <div class="detail-panel__actions">
        <a class="btn-directions" id="dp-directions" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M14.146.146a.5.5 0 0 1 .519-.106l.066.036 1 1.5-.066-.036a.5.5 0 0 1-.446.551L15.5 2l-1.5.5L9 4 3.5 11.5 1 15l-.354.354a.5.5 0 0 1-.638-.058l-.058-.066-.354-.354 3-5L4.5 8 11 3l3-2.5.146-.354z"/>
            <path d="M7.543 7.543a.5.5 0 0 1 .707.707l-3 3a.5.5 0 0 1-.707-.707l3-3z"/>
          </svg>
          Directions
        </a>
        <a class="btn-website" id="dp-website" href="#" target="_blank" rel="noopener noreferrer" style="display:none">
          Website ↗
        </a>
      </div>

      <div class="detail-grid" id="dp-grid" role="list"></div>

      <div class="detail-notes" id="dp-notes" style="display:none"></div>

    </div>

  </div>

  <!-- Map -->
  <div id="map">

    <!-- Sync switch -->
    <div class="sync-switch-wrap">
      <label class="sync-label">
        <input type="checkbox" id="sync-checkbox" checked
               aria-label="Update list as I move the map">
        Update list as I move
      </label>
    </div>

    <!-- Custom nav controls -->
    <div class="nav-controls" role="group" aria-label="Map navigation">
      <button class="nav-btn" id="nav-zoom-in" type="button" aria-label="Zoom in">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/>
        </svg>
      </button>
      <button class="nav-btn" id="nav-zoom-out" type="button" aria-label="Zoom out">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M2 8a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 8z"/>
        </svg>
      </button>
      <button class="nav-btn" id="nav-fit" type="button" aria-label="Show all of North America">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M1.5 1h4a.5.5 0 0 1 0 1H2.707l3.647 3.646a.5.5 0 1 1-.708.708L2 2.707V5.5a.5.5 0 0 1-1 0v-4A.5.5 0 0 1 1.5 1zm13 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V2.707l-3.646 3.647a.5.5 0 0 1-.708-.708L13.293 2H10.5a.5.5 0 0 1 0-1h4zM1 10a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1H2.707l3.647 3.646a.5.5 0 0 1-.708.708L2 11.707V14.5a.5.5 0 0 1-1 0v-4zm14 0v4a.5.5 0 0 1-1 0v-2.793l-3.646 3.647a.5.5 0 0 1-.708-.708L13.293 11H10.5a.5.5 0 0 1 0-1h4a.5.5 0 0 1 .5.5z"/>
        </svg>
      </button>
    </div>

    <!-- Grooming legend -->
    <div class="map-legend" aria-label="Grooming legend">
      <div class="map-legend__item">
        <span class="map-legend__dot" style="background:#1b4f8a"></span>Skate + classic
      </div>
      <div class="map-legend__item">
        <span class="map-legend__dot" style="background:#e07b24"></span>Skate only
      </div>
      <div class="map-legend__item">
        <span class="map-legend__dot" style="background:#6cc0e5"></span>Classic only
      </div>
      <div class="map-legend__item">
        <span class="map-legend__dot" style="background:#9aa4ad"></span>Grooming unknown
      </div>
    </div>

  </div>

</div>

<script>

/* =================================================================
   Map setup
   ================================================================= */
mapboxgl.accessToken = 'pk.eyJ1IjoibW94eXBlZCIsImEiOiJjaWgydGpwdmYweHJydnFtMzZzOXpmNjg3In0.5TXWYv0Z7nsOZHneIQOhxg';

var map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v11',
  center: [-98, 38.88],
  minZoom: 1,
  zoom: 3
});

/* =================================================================
   State
   ================================================================= */
var state = {
  location:   null,       // { id, label, lat, lng } — set in Step 6
  filters: {
    skate:    false,      // groomed for skate
    classic:  false,      // groomed for classic
    snow:     false,      // snowmaking
    lit:      false,      // lit at night
    kmMin:    0,          // trail length min (km)
    kmMax:    100         // trail length max; 100 = "100+" (no upper limit)
  },
  sort:       'name',     // 'name' | 'dist' | 'kmDesc' | 'kmAsc' | 'groom' | 'snow'
  sync:       true,       // list follows map view
  selectedId: null        // open area id
};

var allFeatures    = [];
var visibleFeatures = [];  // features in current map bounds (unique by id)
var fullGeoJSON    = null;
var sourceIsFiltered = false;
var lastFilterKey    = '';
var dataLoaded       = false;

/* =================================================================
   DOM refs
   ================================================================= */
var listingEl   = document.getElementById('feature-listing');
var countEl     = document.getElementById('result-count');
var subtitleEl  = document.getElementById('result-subtitle');
var sortEl      = document.getElementById('sort-select');

var popup = new mapboxgl.Popup({ closeButton: false });

/* =================================================================
   Helpers
   ================================================================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isValid(val) {
  if (val === null || val === undefined) return false;
  var s = String(val).trim().toLowerCase();
  return s !== '' && s !== 'n/a' && s !== 'na' && s !== 'unknown' && s !== 'none';
}

/* =================================================================
   Filtering — reads from state.filters
   ================================================================= */
function hasActiveFilters() {
  var f = state.filters;
  return f.skate || f.classic || f.snow || f.lit || f.kmMin > 0 || f.kmMax < 100;
}

function featureMatchesFilters(feature) {
  var prop = feature.properties;
  var f    = state.filters;

  // Grooming: skate and/or classic must be true on the feature
  if (f.skate   && prop.groomSkate   !== true) return false;
  if (f.classic && prop.groomClassic !== true) return false;

  // Snowmaking / Lit
  if (f.snow && prop.Snowmaking !== 'Yes') return false;
  if (f.lit  && prop.Lit        !== 'Yes') return false;

  // Trail length
  var km = prop.km;
  if (f.kmMin > 0) {
    if (km === null) return false;
    if (km < f.kmMin) return false;
  }
  if (f.kmMax < 100) {
    if (km === null) return false;
    if (km > f.kmMax) return false;
  }

  return true;
}

/* =================================================================
   Sorting — reads from state.sort
   ================================================================= */
var GROOM_ORDER = { both: 0, skate: 1, classic: 2, yes: 3, unknown: 3 };

function sortFeatures(arr) {
  var sort = state.sort;
  return arr.slice().sort(function (a, b) {
    var ap = a.properties, bp = b.properties;
    var nameCmp = (ap.Name || '').localeCompare(bp.Name || '');

    if (sort === 'dist' && state.location) {
      return (ap._dist || 0) - (bp._dist || 0) || nameCmp;
    }
    if (sort === 'kmDesc') {
      if (ap.km === null && bp.km === null) return nameCmp;
      if (ap.km === null) return 1;
      if (bp.km === null) return -1;
      return bp.km - ap.km || nameCmp;
    }
    if (sort === 'kmAsc') {
      if (ap.km === null && bp.km === null) return nameCmp;
      if (ap.km === null) return 1;
      if (bp.km === null) return -1;
      return ap.km - bp.km || nameCmp;
    }
    if (sort === 'groom') {
      var ag = GROOM_ORDER[ap.groomType] !== undefined ? GROOM_ORDER[ap.groomType] : 3;
      var bg = GROOM_ORDER[bp.groomType] !== undefined ? GROOM_ORDER[bp.groomType] : 3;
      return ag - bg || nameCmp;
    }
    if (sort === 'snow') {
      return (ap.Snowmaking === 'Yes' ? 0 : 1) - (bp.Snowmaking === 'Yes' ? 0 : 1) || nameCmp;
    }
    // default: name
    return nameCmp;
  });
}

/* =================================================================
   Grooming dot color
   ================================================================= */
var GROOM_COLOR = { both: '#1b4f8a', skate: '#e07b24', classic: '#6cc0e5', unknown: '#9aa4ad', yes: '#9aa4ad' };
var GROOM_LABEL = { both: 'Skate + classic', skate: 'Skate only', classic: 'Classic only', unknown: 'Grooming unknown', yes: 'Grooming unknown' };

/* =================================================================
   Skeleton loading cards
   ================================================================= */
function renderSkeleton() {
  listingEl.innerHTML = '';
  for (var i = 0; i < 8; i++) {
    var sk = document.createElement('div');
    sk.className = 'skeleton';
    sk.innerHTML =
      '<div class="skeleton__line skeleton__line--name"></div>' +
      '<div class="skeleton__line skeleton__line--region"></div>' +
      '<div class="skeleton__line skeleton__line--tags"></div>';
    listingEl.appendChild(sk);
  }
  countEl.textContent = '';
  subtitleEl.textContent = '';
}

/* =================================================================
   Card render
   ================================================================= */
var CAP = 100;

function renderListings(features) {
  listingEl.innerHTML = '';

  /* --- Empty state --- */
  if (features.length === 0) {
    countEl.textContent = hasActiveFilters() ? '0 ski areas' : '';
    subtitleEl.textContent = state.location
      ? 'Distances from ' + state.location.label
      : 'Search a town or use your location to see distances';

    var wrap = document.createElement('div');
    wrap.className = 'listing-empty';
    if (hasActiveFilters()) {
      wrap.textContent = 'No ski areas here match your filters';
      var clrBtn = document.createElement('button');
      clrBtn.className = 'btn-clear-filters';
      clrBtn.textContent = 'Clear filters';
      clrBtn.addEventListener('click', clearFilters);
      wrap.appendChild(document.createElement('br'));
      wrap.appendChild(clrBtn);
    } else {
      wrap.textContent = 'Pan and zoom the map to explore ski areas';
    }
    listingEl.appendChild(wrap);
    return;
  }

  /* --- Results header --- */
  var zoom = map.getZoom();
  var countText = features.length + ' ski area' + (features.length !== 1 ? 's' : '');
  if (state.sync) {
    countText += zoom > 5 ? ' in this map view' : ' on the map';
  }
  countEl.textContent = countText;
  subtitleEl.textContent = state.location
    ? 'Distances from ' + state.location.label
    : 'Search a town or use your location to see distances';

  /* --- Sort --- */
  var sorted = sortFeatures(features);
  var capped = sorted.length > CAP;
  var toRender = capped ? sorted.slice(0, CAP) : sorted;

  /* --- Cards --- */
  toRender.forEach(function (feature) {
    var prop = feature.properties;
    var gt   = prop.groomType || 'unknown';

    var btn = document.createElement('button');
    btn.className = 'card' + (prop.id === state.selectedId ? ' is-active' : '');
    btn.type = 'button';
    btn.setAttribute('role', 'listitem');
    btn.dataset.id = prop.id;

    /* Top row: name + distance */
    var top = document.createElement('div');
    top.className = 'card__top';
    var nameEl = document.createElement('span');
    nameEl.className = 'card__name';
    nameEl.textContent = prop.Name;
    top.appendChild(nameEl);
    if (state.location && prop._dist != null) {
      var distEl = document.createElement('span');
      distEl.className = 'card__distance';
      distEl.textContent = formatDist(prop._dist);
      top.appendChild(distEl);
    }
    btn.appendChild(top);

    /* Region */
    if (prop.region) {
      var regionEl = document.createElement('div');
      regionEl.className = 'card__region';
      regionEl.textContent = prop.region;
      btn.appendChild(regionEl);
    }

    /* Tags */
    var tags = document.createElement('div');
    tags.className = 'card__tags';

    // Grooming tag
    var groomTag = document.createElement('span');
    groomTag.className = 'tag tag--groom';
    var dot = document.createElement('span');
    dot.className = 'tag__dot';
    dot.style.background = GROOM_COLOR[gt] || GROOM_COLOR.unknown;
    groomTag.appendChild(dot);
    groomTag.appendChild(document.createTextNode(GROOM_LABEL[gt] || 'Grooming unknown'));
    tags.appendChild(groomTag);

    // km tag
    if (prop.km !== null && prop.km !== undefined) {
      var kmTag = document.createElement('span');
      kmTag.className = 'tag tag--km';
      kmTag.textContent = prop.km + ' km';
      tags.appendChild(kmTag);
    }

    // Snowmaking tag
    if (prop.Snowmaking === 'Yes') {
      var snowTag = document.createElement('span');
      snowTag.className = 'tag tag--snow';
      snowTag.textContent = 'Snowmaking';
      tags.appendChild(snowTag);
    }

    // Lit tag
    if (prop.Lit === 'Yes') {
      var litTag = document.createElement('span');
      litTag.className = 'tag tag--lit';
      litTag.textContent = 'Lit at night';
      tags.appendChild(litTag);
    }

    btn.appendChild(tags);

    /* Interactions */
    btn.addEventListener('mouseover', function () {
      setHover(prop.id);
    });
    btn.addEventListener('mouseout', function () {
      clearHover();
    });

    btn.addEventListener('click', function () {
      // Clear previous selected feature-state
      if (state.selectedId) {
        map.setFeatureState({ source: 'nordic-ski-areas', id: state.selectedId }, { selected: false });
      }
      listingEl.querySelectorAll('.card').forEach(function (el) { el.classList.remove('is-active'); });
      btn.classList.add('is-active');
      state.selectedId = prop.id;
      map.setFeatureState({ source: 'nordic-ski-areas', id: prop.id }, { selected: true });
      openDetailPanel(feature);
    });

    listingEl.appendChild(btn);
  });

  /* "Zoom in to see more" row */
  if (capped) {
    var more = document.createElement('div');
    more.className = 'listing-more';
    more.textContent = 'Showing 100 of ' + sorted.length + ' areas. Zoom in to see fewer.';
    listingEl.appendChild(more);
  }
}

/* =================================================================
   Step 5: Map restyle — hover/selection helpers, nav controls, sync
   ================================================================= */
var hoveredId = null;
var dataBounds = null;

function setHover(id) {
  if (hoveredId === id) return;
  if (hoveredId !== null) {
    map.setFeatureState({ source: 'nordic-ski-areas', id: hoveredId }, { hover: false });
    listingEl.querySelectorAll('.card.is-pin-hover').forEach(function (el) {
      el.classList.remove('is-pin-hover');
    });
  }
  hoveredId = id;
  if (id !== null) {
    map.setFeatureState({ source: 'nordic-ski-areas', id: id }, { hover: true });
    var matchCard = listingEl.querySelector('[data-id="' + id + '"]');
    if (matchCard) matchCard.classList.add('is-pin-hover');
  }
}

function clearHover() {
  setHover(null);
}

/* Sync checkbox */
var syncCheckbox = document.getElementById('sync-checkbox');
if (syncCheckbox) {
  syncCheckbox.addEventListener('change', function () {
    state.sync = syncCheckbox.checked;
    if (state.sync) updateVisibleFeatures();
  });
}

/* Custom nav buttons */
var navZoomIn  = document.getElementById('nav-zoom-in');
var navZoomOut = document.getElementById('nav-zoom-out');
var navFit     = document.getElementById('nav-fit');

if (navZoomIn)  navZoomIn.addEventListener('click',  function () { map.zoomIn(); });
if (navZoomOut) navZoomOut.addEventListener('click', function () { map.zoomOut(); });
if (navFit) {
  navFit.addEventListener('click', function () {
    if (dataBounds) {
      map.fitBounds(dataBounds, { padding: 40 });
    } else {
      map.flyTo({ center: [-98, 47], zoom: 3.5 });
    }
  });
}

/* =================================================================
   Distance formatting (haversine — location added in Step 6)
   ================================================================= */
function formatDist(miles) {
  if (miles < 10) return (Math.round(miles * 10) / 10) + ' mi';
  return Math.round(miles) + ' mi';
}

/* =================================================================
   Clear filters
   ================================================================= */
function clearFilters() {
  state.filters = { skate: false, classic: false, snow: false, lit: false, kmMin: 0, kmMax: 100 };
  // Sync filter DOM elements (defined in Step 4 JS below; safe at runtime)
  if (filterSkateEl)   filterSkateEl.checked   = false;
  if (filterClassicEl) filterClassicEl.checked = false;
  if (filterLitEl)     filterLitEl.checked     = false;
  if (chipSnowEl)      chipSnowEl.setAttribute('aria-pressed', 'false');
  if (tlMinEl)         tlMinEl.value            = '0';
  if (tlMaxEl)         tlMaxEl.value            = '100';
  if (typeof updateTrackFill === 'function') updateTrackFill();
  applyFilters();
}

/* =================================================================
   Apply filters + update map source
   ================================================================= */
function applyFilters() {
  if (typeof updateFilterChipStates === 'function') updateFilterChipStates();
  if (typeof updateHistogram === 'function') updateHistogram();

  var filtered = (state.sync ? visibleFeatures : allFeatures).filter(featureMatchesFilters);

  renderListings(filtered);

  /* Update map source so clusters count only matching features */
  var filterKey = JSON.stringify(state.filters);
  var active    = hasActiveFilters();

  if (active && fullGeoJSON && filterKey !== lastFilterKey) {
    var allFiltered = allFeatures.filter(featureMatchesFilters);
    map.getSource('nordic-ski-areas').setData({ type: 'FeatureCollection', features: allFiltered });
    sourceIsFiltered = true;
    lastFilterKey    = filterKey;
  } else if (!active && sourceIsFiltered && fullGeoJSON) {
    map.getSource('nordic-ski-areas').setData(fullGeoJSON);
    sourceIsFiltered = false;
    lastFilterKey    = '';
  }

  map.setFilter('unclustered-point',         ['!', ['has', 'point_count']]);
  map.setFilter('unclustered-point-hitarea', ['!', ['has', 'point_count']]);
  map.setFilter('unclustered-point-label',   ['!', ['has', 'point_count']]);
}

/* =================================================================
   Visible-feature update (runs on moveend)
   ================================================================= */
function getUniqueById(arr) {
  var seen = {};
  return arr.filter(function (f) {
    var k = f.properties.id;
    if (seen[k]) return false;
    seen[k] = true;
    return true;
  });
}

function updateVisibleFeatures() {
  if (!dataLoaded) return;
  var bounds = map.getBounds();
  var visible = allFeatures.filter(function (f) {
    var c = f.geometry.coordinates;
    return bounds.contains([c[0], c[1]]);
  });
  visibleFeatures = getUniqueById(visible);
  applyFilters();
}

/* =================================================================
   Sort select
   ================================================================= */
sortEl.addEventListener('change', function () {
  state.sort = sortEl.value;
  applyFilters();
});

listingEl.addEventListener('scroll', function () {
  listingEl.classList.toggle('scrolled', listingEl.scrollTop > 0);
});

/* =================================================================
   Map load
   ================================================================= */
map.on('load', function () {

  renderSkeleton();

  map.addSource('nordic-ski-areas', {
    type: 'geojson',
    data: 'data/nordic-ski-areas-v2.geojson',
    cluster: true,
    clusterMaxZoom: 10,
    clusterRadius: 40,
    clusterMinPoints: 6,
    promoteId: 'id'
  });

  fetch('data/nordic-ski-areas-v2.geojson')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      fullGeoJSON = data;
      allFeatures = data.features;
      dataLoaded  = true;

      // Compute bounding box of all features for the "fit" nav button
      if (allFeatures.length) {
        var lngs = allFeatures.map(function (f) { return f.geometry.coordinates[0]; });
        var lats = allFeatures.map(function (f) { return f.geometry.coordinates[1]; });
        dataBounds = [
          [Math.min.apply(null, lngs), Math.min.apply(null, lats)],
          [Math.max.apply(null, lngs), Math.max.apply(null, lats)]
        ];
      }

      updateVisibleFeatures();
    });

  /* Clusters ---------------------------------------------------- */
  /* Navy halo behind cluster circles */
  map.addLayer({
    id: 'cluster-halo',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['has', 'point_count'],
    paint: {
      'circle-color': 'rgba(18,53,91,0.18)',
      'circle-radius': [
        'step', ['get', 'point_count'],
        28, 100, 38, 750, 50
      ]
    }
  });

  map.addLayer({
    id: 'clusters',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['has', 'point_count'],
    paint: {
      'circle-color': '#12355b',
      'circle-radius': [
        'step', ['get', 'point_count'],
        20, 100, 30, 750, 40
      ]
    }
  });

  map.addLayer({
    id: 'cluster-count',
    type: 'symbol',
    source: 'nordic-ski-areas',
    filter: ['has', 'point_count'],
    layout: {
      'text-field': '{point_count_abbreviated}',
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': 12
    },
    paint: {
      'text-color': '#ffffff'
    }
  });

  /* Individual pins --------------------------------------------- */
  map.addLayer({
    id: 'unclustered-point',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': [
        'match', ['get', 'groomType'],
        'both',    '#1b4f8a',
        'skate',   '#e07b24',
        'classic', '#6cc0e5',
        '#9aa4ad'
      ],
      'circle-radius': [
        'case',
        ['any',
          ['boolean', ['feature-state', 'hover'],    false],
          ['boolean', ['feature-state', 'selected'], false]
        ],
        14,
        8
      ],
      'circle-stroke-width': [
        'case',
        ['any',
          ['boolean', ['feature-state', 'hover'],    false],
          ['boolean', ['feature-state', 'selected'], false]
        ],
        3,
        2
      ],
      'circle-stroke-color': [
        'case',
        ['boolean', ['feature-state', 'selected'], false],
        '#12355b',
        '#ffffff'
      ]
    }
  });

  map.addLayer({
    id: 'unclustered-point-hitarea',
    type: 'circle',
    source: 'nordic-ski-areas',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': 'rgba(0,0,0,0)',
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        3, 12, 8, 16, 12, 22, 16, 22
      ],
      'circle-stroke-width': 0,
      'circle-stroke-color': 'rgba(0,0,0,0)'
    }
  });

  map.addLayer({
    id: 'unclustered-point-label',
    type: 'symbol',
    source: 'nordic-ski-areas',
    filter: ['!', ['has', 'point_count']],
    minzoom: 5,
    layout: {
      'text-field': ['get', 'Name'],
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': [
        'interpolate', ['linear'], ['zoom'],
        5, 9, 8, 10, 12, 13
      ],
      'text-offset': [0, 1.5],
      'text-anchor': 'top',
      'text-allow-overlap': false,
      'text-optional': true
    },
    paint: {
      'text-color': '#333',
      'text-halo-color': '#fff',
      'text-halo-width': 1.5
    }
  });

  /* Map interactions -------------------------------------------- */
  map.on('click', 'clusters', function (e) {
    var features  = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
    var clusterId = features[0].properties.cluster_id;
    map.getSource('nordic-ski-areas').getClusterExpansionZoom(clusterId, function (err, zoom) {
      if (err) return;
      map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
    });
  });

  map.on('click', 'unclustered-point-hitarea', function (e) {
    var feat = e.features[0];
    var fid  = feat.properties.id;

    // Clear previous selection
    if (state.selectedId) {
      map.setFeatureState({ source: 'nordic-ski-areas', id: state.selectedId }, { selected: false });

    }
    state.selectedId = fid;

    var fullFeature = allFeatures.find(function (f) { return f.properties.id === fid; });
    if (fullFeature) openDetailPanel(fullFeature);

  map.on('mouseenter', 'clusters', function () { map.getCanvas().style.cursor = 'pointer'; });

    map.getCanvas().style.cursor = 'pointer';
    if (e.features.length) {
      var fid = e.features[0].properties.id;
      setHover(fid);
    }
  });
  map.on('mouseleave', 'unclustered-point-hitarea', function () {
    map.getCanvas().style.cursor = '';
    clearHover();
  });

  map.on('moveend', function () { if (state.sync) updateVisibleFeatures(); });
});

/* ---- Histogram ---- */

// Build 20 empty bar elements once
(function () {
  for (var i = 0; i < 20; i++) {
    var bar = document.createElement('div');
    bar.className = 'tl-bar';
    tlHistEl.appendChild(bar);
  }
}());

function featureMatchesNonKmFilters(feature) {
  var prop = feature.properties;
  var f    = state.filters;
  if (f.skate   && prop.groomSkate   !== true) return false;
  if (f.classic && prop.groomClassic !== true) return false;
  if (f.snow    && prop.Snowmaking   !== 'Yes') return false;
  if (f.lit     && prop.Lit          !== 'Yes') return false;
  return true;
}

function updateHistogram() {
  var pool    = state.sync ? visibleFeatures : allFeatures;
  var buckets = new Array(20).fill(0);

  pool.forEach(function (f) {
    if (!featureMatchesNonKmFilters(f)) return;
    var km = f.properties.km;
    if (km === null || km === undefined) return;
    var b = Math.min(Math.floor(km / 5), 19);
    buckets[b]++;
  });

  var peak  = Math.max.apply(null, buckets) || 1;
  var kmMin = state.filters.kmMin;
  var kmMax = state.filters.kmMax;
  var bars  = tlHistEl.querySelectorAll('.tl-bar');

  bars.forEach(function (bar, i) {
    var lo    = i * 5;
    var hi    = lo + 5;
    var count = buckets[i];
    var h     = count === 0 ? 0 : Math.max(5, Math.round((count / peak) * 44));
    bar.style.height = h + 'px';

    var aboveMin = hi > kmMin;
    var belowMax = kmMax >= 100 || lo < kmMax;
    var inRange  = aboveMin && belowMax;
    bar.style.background = (count > 0 && inRange) ? '#7fa6c9' : '#e4e8ec';
  });
}

/* ---- Trail length slider ---- */

function updateTrackFill() {
  var min = state.filters.kmMin;
  var max = state.filters.kmMax;
  tlFillEl.style.left  = min + '%';
  tlFillEl.style.right = (100 - max) + '%';

  if (min === 0 && max >= 100) {
    tlReadoutEl.textContent = 'Any length';
  } else if (max >= 100) {
    tlReadoutEl.textContent = min + ' km – 100+ km';
  } else {
    tlReadoutEl.textContent = min + ' km – ' + max + ' km';
  }

  // When both handles crowd the right end, raise min so it can slide back left
  tlMinEl.classList.toggle('tl-range--top', min >= 95 && max >= 100);
}

tlMinEl.addEventListener('input', function () {
  var minVal = parseInt(tlMinEl.value, 10);
  var maxVal = parseInt(tlMaxEl.value, 10);
  if (minVal >= maxVal) { minVal = maxVal - 5; tlMinEl.value = minVal; }
  state.filters.kmMin = Math.max(0, minVal);
  updateTrackFill();
  updateHistogram();
  applyFilters();
});

tlMaxEl.addEventListener('input', function () {
  var minVal = parseInt(tlMinEl.value, 10);
  var maxVal = parseInt(tlMaxEl.value, 10);
  if (maxVal <= minVal) { maxVal = minVal + 5; tlMaxEl.value = maxVal; }
  state.filters.kmMax = Math.min(100, maxVal);
  updateTrackFill();
  updateHistogram();
  applyFilters();
});

updateTrackFill();

/* ---- Popover open / close ---- */

var openPopover = null;

function closeAllPopovers() {
  [popoverGroomEl, popoverMoreEl].forEach(function (p) {
    p.classList.remove('is-open');
  });
  chipGroomingEl.setAttribute('aria-expanded', 'false');
  chipMoreEl.setAttribute('aria-expanded', 'false');
  openPopover = null;
}

function togglePopover(popoverEl, chipEl, showBtn) {
  var willOpen = !popoverEl.classList.contains('is-open');
  closeAllPopovers();
  if (willOpen) {
    popoverEl.classList.add('is-open');
    chipEl.setAttribute('aria-expanded', 'true');
    openPopover = popoverEl;
    if (showBtn) updateShowButton(showBtn);
  }
}

document.addEventListener('click', function (e) {
  if (!openPopover) return;
  if (openPopover.contains(e.target)) return;
  if (chipGroomingEl.contains(e.target)) return;
  if (chipMoreEl.contains(e.target)) return;
  closeAllPopovers();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && openPopover) {
    var chip = openPopover === popoverGroomEl ? chipGroomingEl : chipMoreEl;
    closeAllPopovers();
    chip.focus();
  }
});

/* ---- Grooming popover ---- */

chipGroomingEl.addEventListener('click', function () {
  togglePopover(popoverGroomEl, chipGroomingEl, btnShowGroomEl);
});

function updateGroomingChip() {
  var s = state.filters.skate;
  var c = state.filters.classic;
  var label = (s && c) ? 'Skate + classic'
            : s        ? 'Skate groomed'
            : c        ? 'Classic groomed'
            : 'Grooming';
  chipGroomLabelEl.textContent = label;
  chipGroomingEl.classList.toggle('is-active', !!(s || c));
}

filterSkateEl.addEventListener('change', function () {
  state.filters.skate = filterSkateEl.checked;
  updateGroomingChip();
  updateShowButton(btnShowGroomEl);
  applyFilters();
});

filterClassicEl.addEventListener('change', function () {
  state.filters.classic = filterClassicEl.checked;
  updateGroomingChip();
  updateShowButton(btnShowGroomEl);
  applyFilters();
});

btnShowGroomEl.addEventListener('click', function () {
  closeAllPopovers();
  chipGroomingEl.focus();
});

/* ---- Snowmaking chip ---- */

chipSnowEl.addEventListener('click', function () {
  state.filters.snow = !state.filters.snow;
  chipSnowEl.setAttribute('aria-pressed', state.filters.snow ? 'true' : 'false');
  applyFilters();
});

/* ---- More filters popover ---- */

chipMoreEl.addEventListener('click', function () {
  togglePopover(popoverMoreEl, chipMoreEl, btnShowMoreEl);
});

function updateMoreChip() {
  var count = state.filters.lit ? 1 : 0;
  chipMoreLabelEl.textContent = count > 0 ? 'More filters (' + count + ')' : 'More filters';
  chipMoreEl.classList.toggle('is-active', count > 0);
}

filterLitEl.addEventListener('change', function () {
  state.filters.lit = filterLitEl.checked;
  updateMoreChip();
  updateShowButton(btnShowMoreEl);
  applyFilters();
});

btnShowMoreEl.addEventListener('click', function () {
  closeAllPopovers();
  chipMoreEl.focus();
});

/* ---- Show N areas button ---- */

function updateShowButton(btn) {
  var pool  = state.sync ? visibleFeatures : allFeatures;
  var count = pool.filter(featureMatchesFilters).length;
  btn.textContent = 'Show ' + count + ' areas';
}

   Step 7: Detail panel
   ================================================================= */

var detailPanelEl   = document.getElementById('detail-panel');
var detailBackEl    = document.getElementById('detail-back');
var dpNameEl        = document.getElementById('dp-name');
var dpRegionEl      = document.getElementById('dp-region');
var dpDirectionsEl  = document.getElementById('dp-directions');
var dpWebsiteEl     = document.getElementById('dp-website');
var dpGridEl        = document.getElementById('dp-grid');
var dpNotesEl       = document.getElementById('dp-notes');
var resultsHeaderEl = document.querySelector('.results-header');

var listScrollTop = 0;

var GROOM_COLORS = { both: '#1b4f8a', skate: '#e07b24', classic: '#6cc0e5', unknown: '#9aa4ad' };

function groomDisplayInfo(prop) {
  var sk = prop.groomSkate   === true || prop.groomSkate   === 'true';
  var cl = prop.groomClassic === true || prop.groomClassic === 'true';
  if (sk && cl) return { label: 'Skate + classic', color: GROOM_COLORS.both };
  if (sk)       return { label: 'Skate only',       color: GROOM_COLORS.skate };
  if (cl)       return { label: 'Classic only',     color: GROOM_COLORS.classic };
  return        { label: 'Unknown',                 color: GROOM_COLORS.unknown };
}

function isValidUrl(s) {
  try { var u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; }
  catch (e) { return false; }
}

function openDetailPanel(feature) {
  var prop = feature.properties;

  listScrollTop = listingEl.scrollTop;

  // Name
  dpNameEl.textContent = prop.Name || '';

  // Region + distance
  var regionParts = [];
  if (prop.region) regionParts.push(prop.region);
  if (state.location && prop._dist != null) regionParts.push(formatDist(prop._dist) + ' away');
  dpRegionEl.textContent = regionParts.join(' · ');

  // Directions
  var lat = feature.geometry.coordinates[1];
  var lng = feature.geometry.coordinates[0];
  dpDirectionsEl.setAttribute('href',
    'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng);

  // Website
  if (prop.URL && isValidUrl(prop.URL)) {
    dpWebsiteEl.setAttribute('href', prop.URL);
    dpWebsiteEl.style.display = '';
  } else {
    dpWebsiteEl.style.display = 'none';
  }

  // Fact grid
  dpGridEl.innerHTML = '';

  function addGridItem(label, valueEl) {
    var item = document.createElement('div');
    item.className = 'detail-grid__item';
    item.setAttribute('role', 'listitem');
    var lbl = document.createElement('div');
    lbl.className = 'detail-grid__label';
    lbl.textContent = label;
    item.appendChild(lbl);
    item.appendChild(valueEl);
    dpGridEl.appendChild(item);
  }

  function textValue(text) {
    var el = document.createElement('div');
    el.className = 'detail-grid__value';
    el.textContent = text;
    return el;
  }

  // Trail length
  var km = prop.km;
  var skKm = prop.kmSkate;
  var clKm = prop.kmClassic;
  var kmDisplay;
  if (km != null) {
    var parts = [];
    if (skKm != null) parts.push(skKm + ' km skate');
    if (clKm != null) parts.push(clKm + ' km classic');
    kmDisplay = parts.length ? parts.join(', ') : km + ' km';
  } else {
    kmDisplay = '—';
  }
  addGridItem('Trail length', textValue(kmDisplay));

  // Grooming
  var groomInfo = groomDisplayInfo(prop);
  var groomVal  = document.createElement('div');
  groomVal.className = 'detail-grid__value';
  var dot = document.createElement('span');
  dot.className = 'detail-grid__dot';
  dot.style.background = groomInfo.color;
  var groomText = document.createTextNode(groomInfo.label);
  groomVal.appendChild(dot);
  groomVal.appendChild(groomText);
  addGridItem('Grooming', groomVal);

  // Snowmaking
  addGridItem('Snowmaking', textValue(prop.Snowmaking === 'Yes' ? 'Yes' : 'No'));

  // Lit at night
  addGridItem('Lit at night', textValue(prop.Lit === 'Yes' ? 'Yes' : 'No'));

  // Optional fields — only when data exists
  if (isValid(prop.passPrice)) addGridItem('Day pass',        textValue(prop.passPrice));
  if (isValid(prop.rentals))   addGridItem('Rentals',         textValue(prop.rentals));
  if (isValid(prop.lessons))   addGridItem('Lessons',         textValue(prop.lessons));
  if (isValid(prop.dogs))      addGridItem('Dogs on trails',  textValue(prop.dogs));

  // Notes
  if (isValid(prop.Notes)) {
    dpNotesEl.textContent = prop.Notes;
    dpNotesEl.style.display = '';
  } else {
    dpNotesEl.style.display = 'none';
  }

  // Show panel, hide list + results header
  listingEl.style.display = 'none';
  resultsHeaderEl.style.display = 'none';
  detailPanelEl.style.display = '';
  detailPanelEl.scrollTop = 0;

  // Fly to pin only if outside current view
  var coords = feature.geometry.coordinates;
  if (!map.getBounds().contains(coords)) {
    map.flyTo({ center: coords, zoom: 12 });
  }

  history.pushState({ areaId: prop.id }, '', location.href);
}

function closeDetailPanel() {
  detailPanelEl.style.display = 'none';
  listingEl.style.display = '';
  resultsHeaderEl.style.display = '';
  listingEl.scrollTop = listScrollTop;

  if (state.selectedId) {
    map.setFeatureState({ source: 'nordic-ski-areas', id: state.selectedId }, { selected: false });
    listingEl.querySelectorAll('.card').forEach(function (el) { el.classList.remove('is-active'); });
    state.selectedId = null;
  }
}

detailBackEl.addEventListener('click', closeDetailPanel);

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && detailPanelEl.style.display !== 'none') {
    closeDetailPanel();
  }
});

window.addEventListener('popstate', function () {
  if (detailPanelEl.style.display !== 'none') closeDetailPanel();
});

/* --- Haversine distance (miles) --- */
function haversine(lat1, lng1, lat2, lng2) {
  var R    = 3958.8;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a    = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
             Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
             Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* --- Stamp _dist on every feature from [lng, lat] --- */
function computeDistances(lnglat) {
  allFeatures.forEach(function (f) {
    var c = f.geometry.coordinates;
    f.properties._dist = haversine(lnglat[1], lnglat[0], c[1], c[0]);
  });
}

/* --- User location dot marker --- */
function placeUserMarker(lnglat) {
  if (userMarker) userMarker.remove();
  var el = document.createElement('div');
  el.className = 'user-location-dot';
  userMarker = new mapboxgl.Marker({ element: el, anchor: 'center' })
    .setLngLat(lnglat)
    .addTo(map);
}

/* --- Set location and switch to nearest sort --- */
function setLocation(lnglat, label) {
  state.location = { lnglat: lnglat, label: label };
  computeDistances(lnglat);
  placeUserMarker(lnglat);
  if (sortOptDistEl) sortOptDistEl.disabled = false;
  state.sort = 'dist';
  sortEl.value = 'dist';
  applyFilters();
}

/* --- Clear location --- */
function clearLocation() {
  if (!state.location) return;
  state.location = null;
  allFeatures.forEach(function (f) { delete f.properties._dist; });
  if (userMarker) { userMarker.remove(); userMarker = null; }
  if (state.sort === 'dist') {
    state.sort = 'name';
    sortEl.value = 'name';
    if (sortOptDistEl) sortOptDistEl.disabled = true;
  }
  applyFilters();
}

/* --- Escape HTML for rendering into innerHTML --- */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* --- Listbox open/close --- */
function openListbox(items) {
  suggestions = items;
  activeIdx   = -1;
  searchListboxEl.innerHTML = '';

  if (!items.length) { closeListbox(); return; }

  items.forEach(function (item, i) {
    var opt = document.createElement('div');
    opt.className = 'search-option';
    opt.setAttribute('role', 'option');
    opt.setAttribute('id', 'search-opt-' + i);
    opt.setAttribute('aria-selected', 'false');
    opt.innerHTML =
      '<span class="search-option__icon" aria-hidden="true">' +
        (item.type === 'area' ? '⛷' : '📍') +
      '</span>' +
      '<span class="search-option__label">' + escHtml(item.label) + '</span>';
    opt.addEventListener('mousedown', function (e) {
      e.preventDefault(); // keep focus on input
      pickSuggestion(i);
    });
    searchListboxEl.appendChild(opt);
  });

  searchListboxEl.style.display = '';
  locationSearchEl.setAttribute('aria-expanded', 'true');
  listboxOpen = true;
}

function closeListbox() {
  searchListboxEl.style.display = 'none';
  locationSearchEl.setAttribute('aria-expanded', 'false');
  locationSearchEl.removeAttribute('aria-activedescendant');
  listboxOpen = false;
  activeIdx   = -1;
}

function setActiveOption(i) {
  var opts = searchListboxEl.querySelectorAll('.search-option');
  if (activeIdx >= 0 && opts[activeIdx]) {
    opts[activeIdx].classList.remove('is-active');
    opts[activeIdx].setAttribute('aria-selected', 'false');
  }
  activeIdx = i;
  if (i >= 0 && opts[i]) {
    opts[i].classList.add('is-active');
    opts[i].setAttribute('aria-selected', 'true');
    locationSearchEl.setAttribute('aria-activedescendant', 'search-opt-' + i);
    opts[i].scrollIntoView({ block: 'nearest' });
  }
}

/* --- Pick a suggestion --- */
function pickSuggestion(i) {
  var item = suggestions[i];
  if (!item) return;
  locationSearchEl.value = item.label;
  searchClearEl.style.display = '';
  closeListbox();

  if (item.type === 'area') {
    if (state.selectedId) {
      map.setFeatureState({ source: 'nordic-ski-areas', id: state.selectedId }, { selected: false });
    }
    listingEl.querySelectorAll('.card').forEach(function (el) { el.classList.remove('is-active'); });
    state.selectedId = item.featureId;
    map.setFeatureState({ source: 'nordic-ski-areas', id: item.featureId }, { selected: true });
    map.flyTo({ center: item.coords, zoom: 12 });
    var fullFeature = allFeatures.find(function (f) { return f.properties.id === item.featureId; });
    if (fullFeature) openDetailPanel(fullFeature);
  } else {
    setLocation(item.coords, item.label);
    map.flyTo({ center: item.coords, zoom: 9 });
  }
}

/* --- Local ski-area name search (up to 3 results) --- */
function searchAreaNames(q) {
  var lower   = q.toLowerCase();
  var results = [];
  for (var i = 0; i < allFeatures.length && results.length < 3; i++) {
    var f    = allFeatures[i];
    var name = (f.properties.Name || '').toLowerCase();
    if (name.indexOf(lower) !== -1) {
      results.push({
        type:      'area',
        label:     f.properties.Name,
        coords:    f.geometry.coordinates,
        featureId: f.properties.id
      });
    }
  }
  return results;
}

/* --- Mapbox Geocoding API --- */
function geocode(q, callback) {
  var url = 'https://api.mapbox.com/geocoding/v5/mapbox.places/' +
    encodeURIComponent(q) +
    '.json?access_token=' + MAPBOX_TOKEN +
    '&types=place,district,postcode,locality,neighborhood,address' +
    '&country=us,ca&limit=4';
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var places = (data.features || []).slice(0, 4).map(function (f) {
        return { type: 'place', label: f.place_name, coords: f.geometry.coordinates };
      });
      callback(places);
    })
    .catch(function () { callback([]); });
}

/* --- Input events --- */
locationSearchEl.addEventListener('input', function () {
  var q = locationSearchEl.value.trim();
  searchClearEl.style.display = q ? '' : 'none';
  clearTimeout(geocodeTimer);
  if (!q) { closeListbox(); return; }

  var areaMatches = dataLoaded ? searchAreaNames(q) : [];
  if (areaMatches.length) openListbox(areaMatches); // show instantly

  geocodeTimer = setTimeout(function () {
    geocode(q, function (places) {
      openListbox(areaMatches.concat(places));
    });
  }, 280);
});

locationSearchEl.addEventListener('keydown', function (e) {
  if (!listboxOpen) return;
  var len = suggestions.length;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setActiveOption((activeIdx + 1) % len);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setActiveOption((activeIdx - 1 + len) % len);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIdx >= 0) pickSuggestion(activeIdx);
    else if (suggestions.length) pickSuggestion(0);
  } else if (e.key === 'Escape') {
    closeListbox();
  }
});

locationSearchEl.addEventListener('blur', function () {
  setTimeout(closeListbox, 150);
});

locationSearchEl.addEventListener('focus', function () {
  var q = locationSearchEl.value.trim();
  if (q && dataLoaded) {
    var areaMatches = searchAreaNames(q);
    if (areaMatches.length) openListbox(areaMatches);
  }
});

/* --- Clear button --- */
searchClearEl.addEventListener('click', function () {
  locationSearchEl.value = '';
  searchClearEl.style.display = 'none';
  closeListbox();
  clearLocation();
  locationSearchEl.focus();
});

/* --- Geolocate button --- */
btnGeolocateEl.addEventListener('click', function () {
  if (!navigator.geolocation) { alert('Geolocation is not supported by your browser.'); return; }
  btnGeolocateEl.classList.add('is-loading');
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      btnGeolocateEl.classList.remove('is-loading');
      var coords = [pos.coords.longitude, pos.coords.latitude];
      locationSearchEl.value = 'My location';
      searchClearEl.style.display = '';
      closeListbox();
      setLocation(coords, 'My location');
      map.flyTo({ center: coords, zoom: 9 });
    },
    function () {
      btnGeolocateEl.classList.remove('is-loading');
      alert('Could not get your location. Try searching by city or ZIP code.');
    },
    { timeout: 10000 }
  );
});

/* ---- Master chip-state sync (called from applyFilters) ---- */

function updateFilterChipStates() {
  updateGroomingChip();
  updateMoreChip();
  chipSnowEl.setAttribute('aria-pressed', state.filters.snow ? 'true' : 'false');

  var f           = state.filters;
  var activeCount = [f.skate, f.classic, f.snow, f.lit].filter(Boolean).length
                  + (f.kmMin > 0 || f.kmMax < 100 ? 1 : 0);
  chipClearEl.style.display   = activeCount > 0 ? '' : 'none';
  chipClearEl.textContent     = 'Clear all (' + activeCount + ')';
}

</script>
